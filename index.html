<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Have a Bird 2 Wiki</title>
    <!-- Librerías de Three.js para renderizar modelos 3D y fondos 360 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Estilo Antiguo / Wiki -->
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --link-color: #0645ad;
            --border-color: #a2a9b1;
            --box-bg: #f8f9fa;
            --hover-bg: #eaecf0;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
            font-weight: normal;
        }

        .user-info {
            font-size: 0.9rem;
            color: #54595d;
        }

        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        sidebar {
            width: 270px;
            border-right: 1px solid var(--border-color);
            padding: 20px 15px;
            background-color: #f6f6f6;
            box-sizing: border-box;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar-top {
            flex-grow: 1;
            overflow-y: auto;
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
        }

        sidebar h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #54595d;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-top: 15px;
        }

        sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            min-height: 20px;
        }

        sidebar li {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border: 1px solid transparent;
            padding: 2px 4px;
            cursor: grab;
        }

        sidebar li:active {
            cursor: grabbing;
        }

        sidebar li.drag-over {
            border: 1px dashed var(--link-color);
            background: #eaf3ff;
        }

        sidebar a {
            color: var(--link-color);
            text-decoration: none;
            cursor: pointer;
            display: block;
            padding: 3px 6px;
            flex-grow: 1;
        }

        sidebar a:hover {
            text-decoration: underline;
        }

        main {
            flex-grow: 1;
            padding: 30px;
            max-width: 900px;
            box-sizing: border-box;
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-top: 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .auth-container {
            width: 350px;
            border: 1px solid var(--border-color);
            padding: 30px;
            background-color: var(--box-bg);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            background: #fff;
        }

        button {
            background-color: #f8f9fa;
            border: 1px solid #72777d;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--hover-bg);
        }

        button.primary {
            background-color: #36c;
            color: white;
            border-color: #36c;
        }

        button.primary:hover {
            background-color: #2a4b8d;
        }

        button.danger {
            color: #ba0000;
            border-color: #ba0000;
        }

        button.danger:hover {
            background-color: #fdf2f2;
        }

        .search-box {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        .search-box input {
            flex-grow: 1;
            padding: 6px;
            border: 1px solid var(--border-color);
        }

        .rarity-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            margin-bottom: 20px;
            align-items: center;
        }
        .rarity-filter-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            cursor: pointer;
            background: #fff;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
        }

        .rarity-category-group {
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            background: #fff;
        }
        .rarity-category-header {
            padding: 10px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            color: #ffffff !important;
        }
        .rarity-category-body {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            background: #fafafa;
        }
        .rarity-category-body.collapsed {
            display: none;
        }

        .post-card {
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 15px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .post-left {
            flex-grow: 1;
        }

        .post-right {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .media-container {
            width: 100%;
            height: 200px;
            border: 1px solid var(--border-color);
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .media-container img, .media-container video, .media-container canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .fullscreen-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255,255,255,0.8);
            border: 1px solid #72777d;
            padding: 2px 6px;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 10;
        }

        .fullscreen-btn:hover {
            background: #fff;
        }

        .media-container:fullscreen, .media-container:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            background: #000;
        }

        .link-preview-card {
            border: 1px solid var(--border-color);
            background: var(--box-bg);
            padding: 12px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-decoration: none;
            color: inherit;
        }
        .link-preview-card:hover {
            background: var(--hover-bg);
        }
        .link-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #54595d;
        }
        .link-header img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
        .link-body {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .link-body img.thumb {
            width: 80px;
            height: 50px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .link-title {
            font-weight: bold;
            color: var(--link-color);
            font-size: 0.95rem;
        }

        .preview-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding: 8px;
            border: 1px dashed var(--border-color);
            background: #fff;
            font-size: 0.85rem;
        }

        .preview-container img, .preview-container video {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .btn-remove-file {
            background: #ba0000;
            color: white;
            border: none;
            padding: 2px 6px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .rarity-badge, .zone-badge {
            display: inline-block;
            padding: 4px 10px;
            font-weight: bold;
            border-radius: 3px;
            font-size: 0.9rem;
            color: #ffffff !important;
        }

        .rarity-item, .zone-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
            margin-bottom: 5px;
            cursor: grab;
        }
        .rarity-item:active, .zone-item:active {
            cursor: grabbing;
        }

        .admin-controls {
            margin-top: 15px;
            padding: 15px;
            border: 1px dashed var(--border-color);
            background-color: #fff;
        }

        .color-picker-popup {
            position: absolute;
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 15px;
            z-index: 2000;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            width: 320px;
            display: none;
            font-size: 0.85rem;
        }
        .roblox-palette {
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 3px;
            margin-bottom: 10px;
        }
        .roblox-swatch {
            width: 22px;
            height: 18px;
            cursor: pointer;
            border: 1px solid #444;
        }
        .roblox-main-picker {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        #roblox-sv-box {
            width: 180px;
            height: 130px;
            position: relative;
            cursor: crosshair;
            background: linear-gradient(to right, #fff, hsl(0, 100%, 50%));
        }
        #roblox-sv-overlay {
            position: absolute;
            top:0; left:0; width:100%; height:100%;
            background: linear-gradient(to top, #000, transparent);
        }
        #roblox-hue-slider {
            width: 20px;
            height: 130px;
            cursor: pointer;
            background: linear-gradient(to top, red, yellow, lime, cyan, blue, magenta, red);
        }

        @keyframes rarityRotateAnim {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        @keyframes rarityFallAnim {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
    </style>
</head>
<body>

    <script type="application/json" id="ai-datastore-reader">
        { "description": "ESTE BLOQUE ES PARA QUE LA IA LEA EL ESTADO ACTUAL DE LA WIKI" }
    </script>

    <div id="auth-modal" class="modal-overlay">
        <div class="auth-container">
            <h2>Iniciar Sesión / Cuenta</h2>
            <p style="font-size: 0.85rem; color: #54595d;">Introduce tu usuario. Solo <strong>MrPhoenixWiki</strong> tiene privilegios de administrador.</p>
            <div class="form-group">
                <label for="username-input">Usuario:</label>
                <input type="text" id="username-input" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password-input">Contraseña:</label>
                <input type="password" id="password-input" autocomplete="current-password">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="primary" onclick="submitAuthModal()">Acceder</button>
                <button onclick="closeAuthModal()">Cancelar</button>
            </div>
            <p id="auth-error" style="color: red; font-size: 0.85rem; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- PANEL FLOTANTE DE COLOR SÓLIDO -->
    <div id="roblox-color-picker-popup" class="color-picker-popup">
        <div style="font-weight: bold; margin-bottom: 5px;">Colores básicos</div>
        <div class="roblox-palette" id="roblox-basic-palette"></div>
        <div class="roblox-main-picker">
            <div id="roblox-sv-box"><div id="roblox-sv-overlay"></div><div id="roblox-sv-cursor" style="width:8px;height:8px;border:1px solid #fff;position:absolute;transform:translate(-50%,-50%);pointer-events:none;"></div></div>
            <div id="roblox-hue-slider"></div>
        </div>
        <div style="margin-top: 10px; display: flex; justify-content: flex-end; gap: 5px;">
            <button onclick="closeRobloxColorPicker()">Aceptar</button>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <h1>Have a Bird 2 Wiki</h1>
            <div class="user-info">
                Usuario: <strong id="current-user-display"></strong> 
                <span id="admin-badge" style="color: #0645ad; font-weight: bold; display: none;">(Administrador)</span>
                <span id="cloud-sync-status" style="font-size:0.75rem; color:green; margin-left:10px;">(Sincronizado ☁️)</span>
            </div>
        </header>

        <div class="container">
            <sidebar>
                <div class="sidebar-top" id="sidebar-categories-container"></div>
                <div class="sidebar-bottom">
                    <div id="admin-creators" style="display:none; flex-direction:column; gap:8px; margin-bottom: 10px;">
                        <button class="primary" style="width: 100%;" onclick="openCreateCategoryModal()">+ Crear Categoría</button>
                        <button class="primary" style="width: 100%;" onclick="openCreateSectionModal()">+ Crear Sección</button>
                    </div>
                    <h3 style="margin-top:0;">Sistema</h3>
                    <ul>
                        <li><a onclick="openAuthModal()">Iniciar Sesión / Cambiar Cuenta</a></li>
                        <li><a onclick="logoutAnonymous()" style="color: #ba0000;">Cambiar a Anónimo</a></li>
                    </ul>
                </div>
            </sidebar>

            <main id="main-content-area"></main>
        </div>
    </div>

    <script>
        const defaultData = {
            users: [],
            currentUser: null,
            rarities: [
                { name: "Común", style: "#717171", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" },
                { name: "Rara", style: "#0070dd", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" },
                { name: "Épica", style: "#a335ee", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" },
                { name: "Legendaria", style: "#ff8000", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" }
            ],
            zones: [
                { name: "Zona 1", style: "#4CAF50", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" },
                { name: "Zona 2", style: "#2196F3", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" }
            ],
            categories: [
                { id: "nav", name: "Navegación" },
                { id: "sys", name: "Sistema" }
            ],
            sections: [
                { id: "como-se-juega", name: "Como se juega", type: "single", catId: "nav" },
                { id: "pajaros", name: "Pájaros", type: "posts", catId: "nav" },
                { id: "eventos", name: "Eventos", type: "single", catId: "nav" },
                { id: "info-juego", name: "Información del juego", type: "single", catId: "nav" },
                { id: "rarezas", name: "Rarezas", type: "rarities", catId: "sys" },
                { id: "zonas", name: "Zonas", type: "zones", catId: "sys" }
            ],
            posts: {
                "pajaros": []
            },
            singleContent: {
                "como-se-juega": { title: "Como se juega", text: "Información inicial...", media: null, mediaType: null, bg360: null, linkUrl: "" },
                "eventos": { title: "Eventos", text: "Próximos eventos del juego...", media: null, mediaType: null, bg360: null, linkUrl: "" },
                "info-juego": { title: "Información del juego", text: "Detalles sobre el desarrollo...", media: null, mediaType: null, bg360: null, linkUrl: "" }
            }
        };

        // SISTEMA DE SINCRONIZACIÓN EN LA NUBE (JSONbin.io gratuito y público)
        const CLOUD_BIN_ID = "66f4b63cacd3cb34876b5d9b"; 
        const CLOUD_API_KEY = "$2a$10$QWJ2YjBjMDAtMDAwMC0wMDAwLTAwMDAtMDAwMDAwMDAwMDAw"; 
        
        let db = defaultData;
        let activeMediaData = {}; 
        let threeInstances = {}; 
        let activeRarityFilters = {}; 
        let collapsedCategories = {}; 
        let activeFormState = { type: null, rarity: null, editIndex: -1 };

        async function fetchCloudDB() {
            try {
                const response = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_BIN_ID}/latest`, {
                    headers: { "X-Master-Key": CLOUD_API_KEY }
                });
                if (response.ok) {
                    const json = await response.json();
                    if (json && json.record) {
                        return json.record;
                    }
                }
            } catch(e) {
                console.warn("No se pudo conectar a la nube, usando almacenamiento local de respaldo.");
            }
            return null;
        }

        async function saveCloudDB(data) {
            try {
                document.getElementById('cloud-sync-status').textContent = "(Sincronizando 🔄)";
                await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        "Content-Type": "application/json",
                        "X-Master-Key": CLOUD_API_KEY
                    },
                    body: JSON.stringify(data)
                });
                document.getElementById('cloud-sync-status').textContent = "(Sincronizado ☁️)";
            } catch(e) {
                document.getElementById('cloud-sync-status').textContent = "(Error red ⚠️)";
            }
        }

        async function loadDB() {
            let data = await fetchCloudDB();
            if (!data) {
                const savedGlobal = localStorage.getItem('have_a_bird_wiki_global_db_v2');
                if (savedGlobal) {
                    try { data = JSON.parse(savedGlobal); } catch(e){}
                }
            }

            if (!data) {
                data = defaultData;
            } else {
                if (!data.categories) data.categories = defaultData.categories;
                if (!data.sections) data.sections = defaultData.sections;
                if (!data.posts) data.posts = defaultData.posts;
                if (!data.singleContent) data.singleContent = defaultData.singleContent;
                if (!data.rarities) data.rarities = defaultData.rarities;
                if (!data.zones) data.zones = defaultData.zones;

                data.rarities.forEach(r => {
                    if (r.strokeColor === undefined) r.strokeColor = "#000000";
                    if (r.strokeSize === undefined) r.strokeSize = 1;
                    if (r.strokeAlpha === undefined) r.strokeAlpha = 1;
                    if (r.animType === undefined) r.animType = "none";
                });
                data.zones.forEach(z => {
                    if (z.strokeColor === undefined) z.strokeColor = "#000000";
                    if (z.strokeSize === undefined) z.strokeSize = 1;
                    if (z.strokeAlpha === undefined) z.strokeAlpha = 1;
                    if (z.animType === undefined) z.animType = "none";
                });
                if (!data.users) data.users = [];
            }

            let currentUsr = null;
            const savedUserJson = localStorage.getItem('have_a_bird_active_user');
            if (savedUserJson) { try { currentUsr = JSON.parse(savedUserJson); } catch(e){} }

            if (!currentUsr) {
                currentUsr = { username: "Anónimo", password: "", isAdmin: false };
            }
            data.currentUser = currentUsr;
            db = data;
            saveDBLocalOnly(data);
            return data;
        }

        function saveDBLocalOnly(data) {
            try {
                localStorage.setItem('have_a_bird_wiki_global_db_v2', JSON.stringify(data));
                if (data.currentUser) {
                    localStorage.setItem('have_a_bird_active_user', JSON.stringify(data.currentUser));
                }
                const aiReader = document.getElementById('ai-datastore-reader');
                if (aiReader) aiReader.textContent = JSON.stringify(data, null, 2);
            } catch (e) {}
        }

        function saveDB(data) {
            saveDBLocalOnly(data);
            saveCloudDB(data);
        }

        // Bucle de sondeo automático cada 3 segundos para actualización en tiempo real en otros navegadores
        setInterval(async () => {
            const cloudData = await fetchCloudDB();
            if (cloudData) {
                // Comprobar si hay cambios comparando posts o rarezas
                const currentStr = JSON.stringify(db.posts);
                const cloudStr = JSON.stringify(cloudData.posts);
                if (currentStr !== cloudStr) {
                    db = cloudData;
                    saveDBLocalOnly(db);
                    const activeSec = document.querySelector('.section-content.active');
                    // Refrescar vista actual si procede
                    initApp();
                }
            }
        }, 3000);

        function openAuthModal() {
            document.getElementById('auth-modal').style.display = 'flex';
            if (db.currentUser && db.currentUser.username !== "Anónimo") {
                document.getElementById('username-input').value = db.currentUser.username;
            } else {
                document.getElementById('username-input').value = "";
            }
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('auth-error').innerText = "";
        }

        function submitAuthModal() {
            const userIn = document.getElementById('username-input').value.trim();
            const passIn = document.getElementById('password-input').value.trim();
            const errEl = document.getElementById('auth-error');

            if (!userIn) { errEl.innerText = "Introduce un nombre de usuario."; return; }

            const isTargetAdmin = (userIn === "MrPhoenixWiki");

            let user = db.users.find(u => u.username === userIn);
            if (user) {
                user.isAdmin = isTargetAdmin;
            } else {
                user = { username: userIn, password: passIn, isAdmin: isTargetAdmin };
                db.users.push(user);
            }

            db.currentUser = user;
            saveDB(db);
            closeAuthModal();
            initApp();
        }

        function logoutAnonymous() {
            if (confirm("¿Cambiar a modo Anónimo?")) {
                db.currentUser = { username: "Anónimo", password: "", isAdmin: false };
                localStorage.setItem('have_a_bird_active_user', JSON.stringify(db.currentUser));
                initApp();
            }
        }

        async function startupSequence() {
            await loadDB();
            initApp();
        }

        function initApp() {
            document.getElementById('current-user-display').innerText = db.currentUser ? db.currentUser.username : "Anónimo";
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            
            document.getElementById('admin-badge').style.display = isAdmin ? 'inline' : 'none';
            document.getElementById('admin-creators').style.display = isAdmin ? 'flex' : 'none';

            const aiReader = document.getElementById('ai-datastore-reader');
            if (aiReader) aiReader.textContent = JSON.stringify(db, null, 2);

            renderSidebar();
            if (db.sections.length > 0 && !document.querySelector('.section-content.active')) {
                switchSection(db.sections[0].id);
            }
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-categories-container');
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;

            container.innerHTML = db.categories.map(cat => {
                const catSections = db.sections.filter(s => s.catId === cat.id);
                let catDeleteBtn = (isAdmin && cat.id !== 'sys' && cat.id !== 'nav') ? `<button class="danger" style="padding:1px 4px; font-size:0.7rem;" onclick="deleteCategory('${cat.id}')">X</button>` : '';
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-top: 15px;">
                        <h3 style="margin:0; border:none; padding:0;">${cat.name}</h3>
                        ${catDeleteBtn}
                    </div>
                    <ul ondragover="allowDrop(event)" ondragleave="removeDropStyle(event)" ondrop="dropSection(event, '${cat.id}')">
                        ${catSections.map(sec => {
                            let secDeleteBtn = (isAdmin && sec.id !== 'rarezas' && sec.id !== 'zonas') ? `<button class="danger" style="padding: 1px 4px; font-size:0.7rem;" onclick="deleteSection('${sec.id}')">X</button>` : '';
                            return `
                                <li draggable="true" ondragstart="dragStart(event, '${sec.id}')">
                                    <a onclick="switchSection('${sec.id}')">${sec.name}</a>
                                    ${secDeleteBtn}
                                </li>
                            `;
                        }).join('')}
                    </ul>
                `;
            }).join('');
        }

        let draggedSectionId = null;
        function dragStart(event, sectionId) { draggedSectionId = sectionId; event.dataTransfer.setData('text/plain', sectionId); }
        function allowDrop(event) { event.preventDefault(); event.currentTarget.classList.add('drag-over'); }
        function removeDropStyle(event) { event.currentTarget.classList.remove('drag-over'); }
        function dropSection(event, targetCatId) {
            event.preventDefault(); event.currentTarget.classList.remove('drag-over');
            if (!draggedSectionId) return;
            const sec = db.sections.find(s => s.id === draggedSectionId);
            if (sec) { sec.catId = targetCatId; saveDB(db); renderSidebar(); }
            draggedSectionId = null;
        }

        function openCreateCategoryModal() {
            const name = prompt("Nombre de la nueva categoría:");
            if (!name) return;
            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '-');
            if (db.categories.some(c => c.id === id)) { alert("Ya existe."); return; }
            db.categories.push({ id, name }); saveDB(db); renderSidebar();
        }

        function deleteCategory(catId) {
            if (confirm("¿Borrar categoría?")) {
                db.sections = db.sections.filter(s => s.catId !== catId);
                db.categories = db.categories.filter(c => c.id !== catId);
                saveDB(db); renderSidebar();
                if (db.sections.length > 0) switchSection(db.sections[0].id);
            }
        }

        function openCreateSectionModal() {
            if (db.categories.length === 0) return;
            const name = prompt("Nombre de la nueva sección:");
            if (!name) return;
            let catOptions = db.categories.map(c => `${c.name} (ID: ${c.id})`).join('\n');
            const catChoice = prompt(`¿A qué categoría pertenece? Escribe el ID exacto:\n\n${catOptions}`);
            if (!db.categories.some(c => c.id === catChoice)) { alert("No válida."); return; }
            const typeChoice = prompt("¿Tipo de sección? 'posts' o 'single'").toLowerCase().trim();
            if (typeChoice !== 'posts' && typeChoice !== 'single') return;
            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '-');
            db.sections.push({ id, name, type: typeChoice, catId: catChoice });
            if (typeChoice === 'posts') db.posts[id] = [];
            else db.singleContent[id] = { title: name, text: "Contenido...", media: null, mediaType: null, bg360: null, linkUrl: "" };
            saveDB(db); renderSidebar(); switchSection(id);
        }

        function deleteSection(sectionId) {
            if (confirm("¿Eliminar sección?")) {
                db.sections = db.sections.filter(s => s.id !== sectionId);
                delete db.posts[sectionId]; delete db.singleContent[sectionId];
                saveDB(db); renderSidebar();
                if (db.sections.length > 0) switchSection(db.sections[0].id);
            }
        }

        function switchSection(sectionId) {
            const sec = db.sections.find(s => s.id === sectionId);
            if (!sec) return;
            const mainArea = document.getElementById('main-content-area');
            if (sec.type === 'rarezas') {
                mainArea.innerHTML = renderRaritiesSection();
                renderRaritiesList();
            } else if (sec.type === 'zones') {
                mainArea.innerHTML = renderZonesSection();
                renderZonesList();
            } else if (sec.type === 'single') {
                mainArea.innerHTML = renderSingleSection(sec);
                renderSingleContent(sec.id);
            } else if (sec.type === 'posts') {
                if (sectionId === 'pajaros') {
                    db.rarities.forEach(r => { if (activeRarityFilters[r.name] === undefined) activeRarityFilters[r.name] = true; });
                    mainArea.innerHTML = renderPajarosSection();
                    activeFormState = { type: null, rarity: null, editIndex: -1 };
                    renderPajaros();
                } else {
                    mainArea.innerHTML = renderGenericPostsSection(sec);
                    renderGenericPosts(sec.id);
                }
            }
        }

        function renderSingleSection(sec) {
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            let adminForm = isAdmin ? `
                <div class="admin-controls">
                    <h3>Editar Contenido de ${sec.name}</h3>
                    <div class="form-group"><label>Título:</label><input type="text" id="single-title-${sec.id}"></div>
                    <div class="form-group"><label>Texto / Contenido:</label><textarea id="single-text-${sec.id}" rows="5"></textarea></div>
                    <div class="form-group"><label>Multimedia:</label><input type="file" id="single-file-${sec.id}" accept="image/*,video/*,.glb,.gltf" onchange="previewFileCustom('${sec.id}')"><div id="single-preview-${sec.id}"></div></div>
                    <div class="form-group" id="single-bg360-group-${sec.id}" style="display:none;"><label>Fondo 360°:</label><input type="file" id="single-bg360-${sec.id}" accept="image/*" onchange="previewSingleBg360('${sec.id}')"><div id="single-bg360-preview-${sec.id}"></div></div>
                    <div class="form-group"><label>Enlace Opcional:</label><input type="text" id="single-link-${sec.id}" placeholder="https://..."></div>
                    <button class="primary" onclick="saveSingleContent('${sec.id}')">Guardar Cambios</button>
                </div>
            ` : '';

            return `
                <section class="section-content active">
                    <h2>${sec.name}</h2>
                    <div id="single-display-${sec.id}"></div>
                    ${adminForm}
                </section>
            `;
        }

        function renderGenericPostsSection(sec) {
            return `
                <section class="section-content active">
                    <h2>${sec.name}</h2>
                    <div class="search-box"><input type="text" id="search-${sec.id}" placeholder="Buscar..." oninput="renderGenericPosts('${sec.id}')"></div>
                    <div id="posts-container-${sec.id}"></div>
                </section>
            `;
        }

        function renderPajarosSection() {
            return `
                <section class="section-content active">
                    <h2>Pájaros</h2>
                    <div class="search-box"><input type="text" id="search-pajaros" placeholder="Buscar pájaro por nombre..." oninput="renderPajaros()"></div>
                    
                    <div class="rarity-filter-bar">
                        <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                            <strong>Filtrar por Rarezas:</strong>
                            <div>
                                <button onclick="setAllRarityFilters(true)">Seleccionar todas</button>
                                <button onclick="setAllRarityFilters(false)">Deseleccionar todas</button>
                            </div>
                        </div>
                        <div id="rarity-checkboxes-container" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
                    </div>

                    <div id="posts-pajaros"></div>
                </section>
            `;
        }

        function previewFileCustom(sectionId) {
            const fileInputId = sectionId === 'pajaros' ? 'pj-media-file' : (sectionId.startsWith('single-') ? `single-file-${sectionId}` : `post-file-${sectionId}`);
            const previewAreaId = sectionId === 'pajaros' ? 'pj-preview-area' : (sectionId.startsWith('single-') ? `single-preview-${sectionId}` : `post-preview-${sectionId}`);
            const bg360GroupId = sectionId === 'pajaros' ? 'pj-bg360-group' : (sectionId.startsWith('single-') ? `single-bg360-group-${sectionId}` : `post-bg360-group-${sectionId}`);

            const fileInput = document.getElementById(fileInputId);
            const previewArea = document.getElementById(previewAreaId);
            const bgGroup = document.getElementById(bg360GroupId);

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    const is3D = file.name.endsWith('.glb') || file.name.endsWith('.gltf');
                    if (bgGroup) bgGroup.style.display = is3D ? 'block' : 'none';

                    activeMediaData[sectionId] = {
                        data: e.target.result,
                        type: is3D ? 'model/gltf-binary' : file.type,
                        name: file.name
                    };
                    renderPreviewBoxCustom(sectionId);
                };
                if (file.name.endsWith('.glb')) reader.readAsArrayBuffer(file);
                else reader.readAsDataURL(file);
            }
        }

        function renderPreviewBoxCustom(sectionId) {
            const previewAreaId = sectionId === 'pajaros' ? 'pj-preview-area' : (sectionId.startsWith('single-') ? `single-preview-${sectionId}` : `post-preview-${sectionId}`);
            const previewArea = document.getElementById(previewAreaId);
            const media = activeMediaData[sectionId];
            if (!media || !media.data) { if(previewArea) previewArea.innerHTML = ''; return; }

            let thumb = media.type && media.type.startsWith('video') ? `<video src="${media.data}"></video>` : 
                        media.type && media.type.includes('model') ? `<div style="display:flex;align-items:center;justify-content:center;background:#ddd;width:60px;height:60px;font-size:0.7rem;">Modelo 3D</div>` :
                        `<img src="${media.data}">`;

            if(previewArea) {
                previewArea.innerHTML = `
                    <div class="preview-container">
                        ${thumb}
                        <div style="flex-grow: 1; word-break: break-all;"><strong>Archivo:</strong> ${media.name}</div>
                        <button class="btn-remove-file" onclick="removeActiveFileCustom('${sectionId}')">X</button>
                    </div>
                `;
            }
        }

        function removeActiveFileCustom(sectionId) {
            activeMediaData[sectionId] = null;
            const fileInputId = sectionId === 'pajaros' ? 'pj-media-file' : (sectionId.startsWith('single-') ? `single-file-${sectionId}` : `post-file-${sectionId}`);
            const bg360GroupId = sectionId === 'pajaros' ? 'pj-bg360-group' : (sectionId.startsWith('single-') ? `single-bg360-group-${sectionId}` : `post-bg360-group-${sectionId}`);
            
            const input = document.getElementById(fileInputId);
            if(input) input.value = '';
            const bg = document.getElementById(bg360GroupId);
            if(bg) bg.style.display = 'none';

            renderPreviewBoxCustom(sectionId);
        }

        function previewSingleBg360(sectionId) {
            const fileInput = document.getElementById(`single-bg360-${sectionId}`);
            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (!activeMediaData[sectionId]) activeMediaData[sectionId] = {};
                    activeMediaData[sectionId].bg360 = e.target.result;
                    const prev = document.getElementById(`single-bg360-preview-${sectionId}`);
                    if(prev) prev.innerHTML = `<p style="color:green; font-size:0.8rem;">Fondo 360 cargado: ${file.name}</p>`;
                };
                reader.readAsDataURL(file);
            }
        }

        function previewPajaroBg360() {
            const fileInput = document.getElementById('pj-bg360-file');
            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (!activeMediaData['pajaros']) activeMediaData['pajaros'] = {};
                    activeMediaData['pajaros'].bg360 = e.target.result;
                    const prev = document.getElementById('pj-bg360-preview-area');
                    if(prev) prev.innerHTML = `<p style="color:green; font-size:0.8rem;">Fondo 360 cargado: ${file.name}</p>`;
                };
                reader.readAsDataURL(file);
            }
        }

        // GESTIÓN DE RAREZAS
        let activeColorInputTarget = null;
        let currentGradientStops = [{pos: 0, color: '#000000'}, {pos: 1, color: '#ffffff'}];
        let selectedStopIdx = 0;
        let draggedRarityIdx = null;

        function renderRaritiesSection() {
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            let adminForm = isAdmin ? `
                <div class="admin-controls">
                    <h3 id="rarity-form-title">Crear / Editar Rareza</h3>
                    <input type="hidden" id="rz-edit-index" value="-1">
                    <div class="form-group"><label>Nombre de la Rareza:</label><input type="text" id="rz-name"></div>
                    
                    <fieldset style="border: 1px solid var(--border-color); padding: 10px; margin-bottom: 15px;">
                        <legend style="font-weight: bold; font-size: 0.85rem;">Estilo de Fondo</legend>
                        <div class="form-group" style="display:flex; gap:10px; margin-bottom:10px;">
                            <button type="button" id="btn-mode-solid" class="primary" onclick="setRarityMode('solid')">Color Sólido</button>
                            <button type="button" id="btn-mode-gradient" onclick="setRarityMode('gradient')">Gradiente</button>
                        </div>
                        <input type="hidden" id="rz-mode" value="solid">

                        <div id="panel-mode-solid" class="form-group" style="margin-bottom:0;">
                            <label>Color:</label>
                            <input type="text" id="rz-solid-color" readonly style="cursor:pointer;" onclick="openRobloxColorPicker(this, event)">
                        </div>

                        <div id="panel-mode-gradient" class="form-group" style="display:none; margin-bottom:0;">
                            <div style="display:flex; gap:10px; margin-bottom:10px;">
                                <div style="flex:1;"><label>Tipo:</label>
                                    <select id="rz-grad-type" onchange="updateGradientPreview()">
                                        <option value="linear">Linear</option>
                                        <option value="radial">Radial</option>
                                        <option value="conical">Conical</option>
                                    </select>
                                </div>
                                <div style="flex:1;"><label>Rotación (°):</label><input type="number" id="rz-grad-rotation" value="0" oninput="updateGradientPreview()"></div>
                            </div>
                            <div style="position:relative; height:35px; background:#333; border:1px solid #555; margin:10px 0; cursor:crosshair;" id="gradient-bar-container" onclick="addGradientStop(event)">
                                <div id="gradient-stops-visual" style="position:absolute; width:100%; height:100%; pointer-events:none;"></div>
                            </div>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <button type="button" onclick="deleteSelectedStop()">Eliminar Punto</button>
                                <span>Color del punto: <input type="text" id="rz-stop-color" readonly style="width:70px; display:inline-block; cursor:pointer;" onclick="openRobloxColorPicker(this, event)"></span>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset style="border: 1px solid var(--border-color); padding: 10px; margin-bottom: 15px;">
                        <legend style="font-weight: bold; font-size: 0.85rem;">UI Stroke (Borde)</legend>
                        <div style="display:flex; gap:10px;">
                            <div style="flex:1;"><label>Color Borde:</label><input type="text" id="rz-stroke-color" readonly style="cursor:pointer; background:#000000; color:#fff;" onclick="openRobloxColorPicker(this, event)" value="#000000"></div>
                            <div style="flex:1;"><label>Grosor (px):</label><input type="number" id="rz-stroke-size" value="1" min="0" max="10"></div>
                        </div>
                    </fieldset>

                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <button class="primary" onclick="saveRarity()">Guardar Rareza</button>
                        <button id="rz-cancel-btn" onclick="cancelEditRarity()" style="display:none;">Cancelar Edición</button>
                    </div>
                </div>
            ` : '';

            return `
                <section class="section-content active">
                    <h2>Rarezas</h2>
                    <p>Arrastra las rarezas para ordenar su jerarquía:</p>
                    <div id="rarities-list"></div>
                    ${adminForm}
                </section>
            `;
        }

        // GESTIÓN DE ZONAS (NUEVO REQUERIMIENTO)
        let draggedZoneIdx = null;

        function renderZonesSection() {
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            let adminForm = isAdmin ? `
                <div class="admin-controls">
                    <h3 id="zone-form-title">Crear / Editar Zona</h3>
                    <input type="hidden" id="zn-edit-index" value="-1">
                    <div class="form-group"><label>Nombre de la Zona:</label><input type="text" id="zn-name"></div>
                    
                    <fieldset style="border: 1px solid var(--border-color); padding: 10px; margin-bottom: 15px;">
                        <legend style="font-weight: bold; font-size: 0.85rem;">Estilo de Fondo de Zona</legend>
                        <div class="form-group" style="display:flex; gap:10px; margin-bottom:10px;">
                            <button type="button" id="zn-btn-mode-solid" class="primary" onclick="setZoneMode('solid')">Color Sólido</button>
                            <button type="button" id="zn-btn-mode-gradient" onclick="setZoneMode('gradient')">Gradiente</button>
                        </div>
                        <input type="hidden" id="zn-mode" value="solid">

                        <div id="zn-panel-mode-solid" class="form-group" style="margin-bottom:0;">
                            <label>Color:</label>
                            <input type="text" id="zn-solid-color" readonly style="cursor:pointer;" onclick="openRobloxColorPicker(this, event)">
                        </div>

                        <div id="zn-panel-mode-gradient" class="form-group" style="display:none; margin-bottom:0;">
                            <div style="display:flex; gap:10px; margin-bottom:10px;">
                                <div style="flex:1;"><label>Tipo:</label>
                                    <select id="zn-grad-type" onchange="updateZoneGradientPreview()">
                                        <option value="linear">Linear</option>
                                        <option value="radial">Radial</option>
                                        <option value="conical">Conical</option>
                                    </select>
                                </div>
                                <div style="flex:1;"><label>Rotación (°):</label><input type="number" id="zn-grad-rotation" value="0" oninput="updateZoneGradientPreview()"></div>
                            </div>
                            <div style="position:relative; height:35px; background:#333; border:1px solid #555; margin:10px 0; cursor:crosshair;" id="zn-gradient-bar-container" onclick="addZoneGradientStop(event)">
                                <div id="zn-gradient-stops-visual" style="position:absolute; width:100%; height:100%; pointer-events:none;"></div>
                            </div>
                            <div style="display:flex; gap:10px; align-items:center;">
                                <button type="button" onclick="deleteZoneSelectedStop()">Eliminar Punto</button>
                                <span>Color del punto: <input type="text" id="zn-stop-color" readonly style="width:70px; display:inline-block; cursor:pointer;" onclick="openRobloxColorPicker(this, event)"></span>
                            </div>
                        </div>
                    </fieldset>

                    <fieldset style="border: 1px solid var(--border-color); padding: 10px; margin-bottom: 15px;">
                        <legend style="font-weight: bold; font-size: 0.85rem;">UI Stroke (Borde)</legend>
                        <div style="display:flex; gap:10px;">
                            <div style="flex:1;"><label>Color Borde:</label><input type="text" id="zn-stroke-color" readonly style="cursor:pointer; background:#000000; color:#fff;" onclick="openRobloxColorPicker(this, event)" value="#000000"></div>
                            <div style="flex:1;"><label>Grosor (px):</label><input type="number" id="zn-stroke-size" value="1" min="0" max="10"></div>
                        </div>
                    </fieldset>

                    <div style="margin-top:15px; display:flex; gap:10px;">
                        <button class="primary" onclick="saveZone()">Guardar Zona</button>
                        <button id="zn-cancel-btn" onclick="cancelEditZone()" style="display:none;">Cancelar Edición</button>
                    </div>
                </div>
            ` : '';

            return `
                <section class="section-content active">
                    <h2>Zonas</h2>
                    <p>Gestiona las zonas del juego con texto y gradiente de fondo:</p>
                    <div id="zones-list"></div>
                    ${adminForm}
                </section>
            `;
        }

        function rDragStart(e, idx) { draggedRarityIdx = idx; e.dataTransfer.setData('text/plain', idx); }
        function rDragOver(e) { e.preventDefault(); }
        function rDrop(e, targetIdx) {
            e.preventDefault();
            if (draggedRarityIdx === null || draggedRarityIdx === targetIdx) return;
            const moved = db.rarities.splice(draggedRarityIdx, 1)[0];
            db.rarities.splice(targetIdx, 0, moved);
            saveDB(db);
            renderRaritiesList();
            draggedRarityIdx = null;
        }

        function zDragStart(e, idx) { draggedZoneIdx = idx; e.dataTransfer.setData('text/plain', idx); }
        function zDragOver(e) { e.preventDefault(); }
        function zDrop(e, targetIdx) {
            e.preventDefault();
            if (draggedZoneIdx === null || draggedZoneIdx === targetIdx) return;
            const moved = db.zones.splice(draggedZoneIdx, 1)[0];
            db.zones.splice(targetIdx, 0, moved);
            saveDB(db);
            renderZonesList();
            draggedZoneIdx = null;
        }

        function setRarityMode(mode) {
            document.getElementById('rz-mode').value = mode;
            if (mode === 'solid') {
                document.getElementById('btn-mode-solid').classList.add('primary');
                document.getElementById('btn-mode-gradient').classList.remove('primary');
                document.getElementById('panel-mode-solid').style.display = 'block';
                document.getElementById('panel-mode-gradient').style.display = 'none';
            } else {
                document.getElementById('btn-mode-gradient').classList.add('primary');
                document.getElementById('btn-mode-solid').classList.remove('primary');
                document.getElementById('panel-mode-solid').style.display = 'none';
                document.getElementById('panel-mode-gradient').style.display = 'block';
                renderGradientBar();
            }
        }

        function setZoneMode(mode) {
            document.getElementById('zn-mode').value = mode;
            if (mode === 'solid') {
                document.getElementById('zn-btn-mode-solid').classList.add('primary');
                document.getElementById('zn-btn-mode-gradient').classList.remove('primary');
                document.getElementById('zn-panel-mode-solid').style.display = 'block';
                document.getElementById('zn-panel-mode-gradient').style.display = 'none';
            } else {
                document.getElementById('zn-btn-mode-gradient').classList.add('primary');
                document.getElementById('zn-btn-mode-solid').classList.remove('primary');
                document.getElementById('zn-panel-mode-solid').style.display = 'none';
                document.getElementById('zn-panel-mode-gradient').style.display = 'block';
                renderZoneGradientBar();
            }
        }

        function renderGradientBar() {
            const container = document.getElementById('gradient-stops-visual');
            if (!container) return;
            let sortedStops = [...currentGradientStops].sort((a,b) => a.pos - b.pos);
            let cssGrad = sortedStops.map(s => `${s.color} ${s.pos * 100}%`).join(', ');
            container.parentElement.style.background = `linear-gradient(to right, ${cssGrad})`;

            container.innerHTML = currentGradientStops.map((stop, idx) => `
                <div style="position:absolute; left:${stop.pos * 100}%; top:0; width:14px; height:100%; transform:translateX(-50%); border:2px solid ${idx === selectedStopIdx ? '#ffff00' : '#fff'}; background:${stop.color}; cursor:ew-resize; pointer-events:auto;" onmousedown="startDragStop(${idx}, event)" onclick="selectGradientStop(${idx}, event)"></div>
            `).join('');

            if (currentGradientStops[selectedStopIdx]) {
                document.getElementById('rz-stop-color').value = currentGradientStops[selectedStopIdx].color;
                document.getElementById('rz-stop-color').style.background = currentGradientStops[selectedStopIdx].color;

        function hsvToRgb(h, s, v) {
            let r, g, b, i, f, p, q, t;
            i = Math.floor(h * 6); f = h * 6 - i;
            p = v * (1 - s); q = v * (1 - f * s); t = v * (1 - (1 - f) * s);
            switch (i % 6) {
                case 0: r = v, g = t, b = p; break;
                case 1: r = q, g = v, b = p; break;
                case 2: r = p, g = v, b = t; break;
                case 3: r = p, g = q, b = v; break;
                case 4: r = t, g = p, b = v; break;
                case 5: r = v, g = p, b = q; break;
            }
            return [Math.round(r * 255), Math.round(g * 255), Math.round(b * 255)];
        }
        function rgbToHex(r, g, b) {
            return "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
        }

        function hexToRgbStr(hex) {
            let c = hex.replace('#','');
            if(c.length===3) c = c.split('').map(x=>x+x).join('');
            let num = parseInt(c,16);
            return `${(num>>16)&255}, ${(num>>8)&255}, ${num&255}`;
        }

        function init3DViewer(canvasId, modelData, bg360Data) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;
            if (threeInstances[canvasId]) {
                cancelAnimationFrame(threeInstances[canvasId].animId);
                threeInstances[canvasId].renderer.dispose();
            }
            const width = canvas.clientWidth || 280;
            const height = canvas.clientHeight || 200;
            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
            camera.position.set(0, 1.5, 4);
            const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            renderer.setSize(width, height);
            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            scene.add(new THREE.AmbientLight(0xffffff, 1.2));
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            new THREE.GLTFLoader().parse(modelData, '', (gltf) => {
                const model = gltf.scene;
                const box = new THREE.Box3().setFromObject(model);
                const center = box.getCenter(new THREE.Vector3());
                const size = box.getSize(new THREE.Vector3());
                model.scale.multiplyScalar(2 / Math.max(size.x, size.y, size.z));
                model.position.sub(center);
                scene.add(model);
            });

            function animate() {
                const animId = requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
                threeInstances[canvasId] = { renderer, animId };
            }
            animate();
        }

            } else {
                activeFormState = { type: 'edit', rarity: null, editIndex: index };
                const p = db.posts['pajaros'][index];
                if (p && p.media) {
                    activeMediaData['pajaros'] = { data: p.media, type: p.mediaType || 'image/png', name: 'Archivo actual', bg360: p.bg360 };
                } else {
                    activeMediaData['pajaros'] = null;
                }
            }
            renderPajaros();
        }

        function renderDynamicPajaroForm(isEditing, targetRarity, editIndex) {
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            if (!isAdmin) return '';

            let pData = { title: '', money: '', text: '', linkUrl: '', rarity: targetRarity || (db.rarities[0] ? db.rarities[0].name : ''), zone: db.zones[0] ? db.zones[0].name : '' };
            if (isEditing && editIndex >= 0) {
                pData = db.posts['pajaros'][editIndex];
            }

            return `
                <div class="admin-controls" style="margin-top: 15px; border: 2px solid #36c;">
                    <h3>${isEditing ? 'Editar Pájaro' : 'Añadir Nuevo Pájaro en ' + targetRarity}</h3>
                    <div class="form-group"><label>Nombre:</label><input type="text" id="dyn-pj-title" value="${pData.title}"></div>
                    <div class="form-group"><label>Rareza:</label>
                        <select id="dyn-pj-rarity">
                            ${db.rarities.map(r => `<option value="${r.name}" ${pData.rarity === r.name ? 'selected' : ''}>${r.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label>Zona:</label>
                        <select id="dyn-pj-zone">
                            ${db.zones.map(z => `<option value="${z.name}" ${pData.zone === z.name ? 'selected' : ''}>${z.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label>Dinero por segundo ($/sec):</label><input type="text" id="dyn-pj-money" value="${pData.money || ''}"></div>
                    <div class="form-group"><label>Información:</label><textarea id="dyn-pj-text" rows="4">${pData.text}</textarea></div>
                    <div class="form-group"><label>Multimedia:</label><input type="file" id="pj-media-file" accept="image/*,video/*,.glb,.gltf" onchange="previewFileCustom('pajaros')"><div id="pj-preview-area"></div></div>
                    <div class="form-group"><label>Enlace Opcional:</label><input type="text" id="dyn-pj-link" value="${pData.linkUrl || ''}" placeholder="https://..."></div>
                    <div style="display: flex; gap: 10px;">
                        <button class="primary" onclick="saveDynamicPajaro(${isEditing ? editIndex : -1})">Guardar</button>
                        <button onclick="activeFormState = {type: null, rarity: null, editIndex: -1}; renderPajaros();">Cancelar</button>
                    </div>
                </div>
            `;
        }

        function saveDynamicPajaro(editIndex) {
            const title = document.getElementById('dyn-pj-title').value;
            const rarity = document.getElementById('dyn-pj-rarity').value;
            const zone = document.getElementById('dyn-pj-zone').value;
            const money = document.getElementById('dyn-pj-money').value;
            const text = document.getElementById('dyn-pj-text').value;
            const linkUrl = document.getElementById('dyn-pj-link').value;

            if (!title || !money || !text) { alert('Completa los campos requeridos.'); return; }

            let mediaData = editIndex >= 0 ? db.posts['pajaros'][editIndex].media : null;
            let mediaType = editIndex >= 0 ? db.posts['pajaros'][editIndex].mediaType : null;
            let bg360Data = editIndex >= 0 ? db.posts['pajaros'][editIndex].bg360 : null;

            if (activeMediaData['pajaros']) {
                mediaData = activeMediaData['pajaros'].data;
                mediaType = activeMediaData['pajaros'].type;
                bg360Data = activeMediaData['pajaros'].bg360 || null;
            }

            const pajaroObj = { title, rarity, zone, money, text, linkUrl, media: mediaData, mediaType: mediaType, bg360: bg360Data };
            if (editIndex >= 0) {
                db.posts['pajaros'][editIndex] = pajaroObj;
            } else {
                if(!db.posts['pajaros']) db.posts['pajaros'] = [];
                db.posts['pajaros'].push(pajaroObj);
            }

            saveDB(db);
            activeFormState = { type: null, rarity: null, editIndex: -1 };
            activeMediaData['pajaros'] = null;
            renderPajaros();
        }

        function renderRarityCheckboxes() {
            const container = document.getElementById('rarity-checkboxes-container');
            if(!container) return;
            container.innerHTML = db.rarities.map(r => {
                return `
                    <label class="rarity-filter-item">
                        <input type="checkbox" ${activeRarityFilters[r.name] !== false ? 'checked' : ''} onchange="toggleRarityFilter('${r.name}')">
                        <span class="rarity-badge" style="background:${r.style}; color:#ffffff !important; font-size:0.75rem; padding:2px 6px;">${r.name}</span>
                    </label>
                `;
            }).join('');
        }

        function toggleRarityFilter(name) {
            activeRarityFilters[name] = !activeRarityFilters[name];
            renderPajaros();
        }

        function setAllRarityFilters(status) {
            db.rarities.forEach(r => activeRarityFilters[r.name] = status);
            renderPajaros();
        }

        function parseMoneyValue(moneyStr) {
            if (!moneyStr) return 0;
            let clean = moneyStr.toString().replace(/[$,\s\/sec]/gi, '').trim();
            const suffixes = ["k", "m", "b", "t", "qa", "qi", "sx", "spt", "oct", "nv", "dc", "ud", "dd", "td", "qad", "qid", "sxd", "spd", "ocd", "nvd", "vc"];
            let multiplier = 1;
            let lowerClean = clean.toLowerCase();
            for (let i = 0; i < suffixes.length; i++) {
                let suf = suffixes[i];
                if (lowerClean.endsWith(suf)) {
                    multiplier = Math.pow(10, (i + 1) * 3);
                    clean = clean.substring(0, clean.length - suf.length);
                    break;
                }
            }
            let num = parseFloat(clean);
            return isNaN(num) ? 0 : num * multiplier;
        }

        function toggleCategoryCollapse(rarityName) {
            collapsedCategories[rarityName] = !collapsedCategories[rarityName];
            renderPajaros();
        }

        function renderPajaros() {
            renderRarityCheckboxes();
            const container = document.getElementById('posts-pajaros');
            const searchVal = document.getElementById('search-pajaros')?.value.toLowerCase() || "";
            const posts = db.posts['pajaros'] || [];

            let htmlOutput = '';
            db.rarities.forEach((rObj) => {
                if (activeRarityFilters[rObj.name] === false) return;

                let rPosts = posts.filter(p => p.rarity === rObj.name);
                if (searchVal) {
                    rPosts = rPosts.filter(p => p.title.toLowerCase().includes(searchVal));
                }

                rPosts.sort((a, b) => parseMoneyValue(a.money) - parseMoneyValue(b.money));

                let isCollapsed = collapsedCategories[rObj.name] || false;
                const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
                let addBtnHtml = isAdmin ? `<button class="primary" style="font-size:0.75rem; padding:2px 6px;" onclick="event.stopPropagation(); toggleAddForm('${rObj.name}')">+ Añadir en ${rObj.name}</button>` : '';
                let addFormHtml = (activeFormState.type === 'create' && activeFormState.rarity === rObj.name) ? renderDynamicPajaroForm(false, rObj.name, -1) : '';

                let contentHtml = '';
                if (rPosts.length === 0) {
                    contentHtml = `<p style="color: #72777d; font-style: italic; margin: 0 0 10px 0;">No hay pájaros en esta rareza todavía.</p>`;
                } else {
                    contentHtml = rPosts.map(p => {
                        let originalIdx = posts.indexOf(p);
                        let cardHtml = renderPostCardHTML(p, 'pajaros', originalIdx);
                        let editFormHtml = (activeFormState.type === 'edit' && activeFormState.editIndex === originalIdx) ? renderDynamicPajaroForm(true, rObj.name, originalIdx) : '';
                        return cardHtml + editFormHtml;
                    }).join('');
                }

                htmlOutput += `
                    <div class="rarity-category-group">
                        <div class="rarity-category-header" style="background: ${rObj.style};" onclick="toggleCategoryCollapse('${rObj.name}')">
                            <span>${isCollapsed ? '▶' : '▼'} Rareza: ${rObj.name} (${rPosts.length})</span>
                            ${addBtnHtml}
                        </div>
                        <div class="rarity-category-body ${isCollapsed ? 'collapsed' : ''}">
                            ${contentHtml}
                            ${addFormHtml}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlOutput;
            if(activeFormState.type !== null) {
                setTimeout(() => renderPreviewBoxCustom('pajaros'), 50);
            }
        }

        function renderPostCardHTML(p, sectionId, index) {
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            const rObj = sectionId === 'pajaros' ? db.rarities.find(r => r.name === p.rarity) : null;
            const zObj = sectionId === 'pajaros' ? db.zones.find(z => z.name === p.zone) : null;

            const rarityBadge = rObj ? `<span class="rarity-badge" style="background: ${rObj.style};">${p.rarity}</span>` : p.rarity;
            const zoneBadge = zObj ? `<span class="zone-badge" style="background: ${zObj.style};">${p.zone}</span>` : (p.zone || 'N/A');

            const extraInfo = sectionId === 'pajaros' ? `<p><strong>Rareza:</strong> ${rarityBadge}</p><p><strong>Zona:</strong> ${zoneBadge}</p><p><strong>Dinero por seg:</strong> $${p.money}/sec</p>` : '';
            let adminButtons = isAdmin ? `<div style="margin-top: 15px; display: flex; gap: 10px;"><button onclick="toggleEditForm(${index})">Editar</button><button class="danger" onclick="deleteGenericPost('${sectionId}', ${index})">Eliminar</button></div>` : '';

            return `<div class="post-card"><div class="post-left"><h3 style="margin-top:0;">${p.title}</h3>${extraInfo}<p style="white-space: pre-wrap;">${p.text}</p>${generateLinkHTML(p.linkUrl)}${adminButtons}</div><div class="post-right">${generateMediaHTML(p.media, p.mediaType, p.bg360, `${sectionId}-${index}`)}</div></div>`;
        }

        function deleteGenericPost(sectionId, index) {
            if (confirm("¿Eliminar post?")) { 
                db.posts[sectionId].splice(index, 1); 
                saveDB(db); 
                renderPajaros(); 
            }
        }

        window.onload = function() { startupSequence(); };
    </script>
</body>
</html>
