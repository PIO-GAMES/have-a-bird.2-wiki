<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Have a Bird 2 Wiki</title>
    <!-- Librerías de Three.js para modelos 3D y fondos 360 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- Estilo Antiguo / Wiki -->
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --link-color: #0645ad;
            --border-color: #a2a9b1;
            --box-bg: #f8f9fa;
            --hover-bg: #eaecf0;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            border-bottom: 1px solid var(--border-color);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #ffffff;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
            font-weight: normal;
        }

        .user-info {
            font-size: 0.9rem;
            color: #54595d;
        }

        .container {
            display: flex;
            min-height: calc(100vh - 70px);
        }

        sidebar {
            width: 270px;
            border-right: 1px solid var(--border-color);
            padding: 20px 15px;
            background-color: #f6f6f6;
            box-sizing: border-box;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .sidebar-top {
            flex-grow: 1;
            overflow-y: auto;
        }

        .sidebar-bottom {
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            margin-top: 15px;
        }

        sidebar h3 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #54595d;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            margin-top: 15px;
        }

        sidebar ul {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            min-height: 20px;
        }

        sidebar li {
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            border: 1px solid transparent;
            padding: 2px 4px;
            cursor: grab;
        }

        sidebar li:active {
            cursor: grabbing;
        }

        sidebar li.drag-over {
            border: 1px dashed var(--link-color);
            background: #eaf3ff;
        }

        sidebar a {
            color: var(--link-color);
            text-decoration: none;
            cursor: pointer;
            display: block;
            padding: 3px 6px;
            flex-grow: 1;
        }

        sidebar a:hover {
            text-decoration: underline;
        }

        main {
            flex-grow: 1;
            padding: 30px;
            max-width: 900px;
            box-sizing: border-box;
        }

        .section-content {
            display: none;
        }

        .section-content.active {
            display: block;
        }

        h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-top: 0;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .auth-container {
            width: 350px;
            border: 1px solid var(--border-color);
            padding: 30px;
            background-color: var(--box-bg);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--border-color);
            box-sizing: border-box;
            background: #fff;
        }

        button {
            background-color: #f8f9fa;
            border: 1px solid #72777d;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button:hover {
            background-color: var(--hover-bg);
        }

        button.primary {
            background-color: #36c;
            color: white;
            border-color: #36c;
        }

        button.primary:hover {
            background-color: #2a4b8d;
        }

        button.danger {
            color: #ba0000;
            border-color: #ba0000;
        }

        button.danger:hover {
            background-color: #fdf2f2;
        }

        .search-box {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box input {
            flex-grow: 1;
            padding: 6px;
            border: 1px solid var(--border-color);
        }

        .search-box select {
            padding: 6px;
            border: 1px solid var(--border-color);
            background: #fff;
        }

        .rarity-filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 12px;
            margin-bottom: 20px;
            align-items: center;
        }
        .rarity-filter-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 0.85rem;
            cursor: pointer;
            background: #fff;
            padding: 4px 8px;
            border: 1px solid var(--border-color);
        }

        .rarity-category-group {
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            background: #fff;
        }
        .rarity-category-header {
            padding: 10px 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            user-select: none;
            color: #ffffff !important;
        }
        .rarity-category-body {
            padding: 15px;
            border-top: 1px solid var(--border-color);
            background: #fafafa;
        }
        .rarity-category-body.collapsed {
            display: none;
        }

        .post-card {
            border: 1px solid var(--border-color);
            padding: 20px;
            margin-bottom: 15px;
            background: #fff;
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        .post-left {
            flex-grow: 1;
        }

        .post-right {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .media-container {
            width: 100%;
            height: 200px;
            border: 1px solid var(--border-color);
            background: #000;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .media-container img, .media-container video, .media-container canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .fullscreen-btn {
            position: absolute;
            bottom: 8px;
            right: 8px;
            background: rgba(255,255,255,0.8);
            border: 1px solid #72777d;
            padding: 2px 6px;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 10;
        }

        .fullscreen-btn:hover {
            background: #fff;
        }

        .media-container:fullscreen, .media-container:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            background: #000;
        }

        .link-preview-card {
            border: 1px solid var(--border-color);
            background: var(--box-bg);
            padding: 12px;
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-decoration: none;
            color: inherit;
        }
        .link-preview-card:hover {
            background: var(--hover-bg);
        }
        .link-header {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: #54595d;
        }
        .link-header img {
            width: 16px;
            height: 16px;
            object-fit: contain;
        }
        .link-body {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .link-body img.thumb {
            width: 80px;
            height: 50px;
            object-fit: cover;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }
        .link-title {
            font-weight: bold;
            color: var(--link-color);
            font-size: 0.95rem;
        }

        .preview-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
            padding: 8px;
            border: 1px dashed var(--border-color);
            background: #fff;
            font-size: 0.85rem;
        }

        .preview-container img, .preview-container video {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border: 1px solid var(--border-color);
        }

        .btn-remove-file {
            background: #ba0000;
            color: white;
            border: none;
            padding: 2px 6px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }

        .rarity-badge, .zone-badge {
            display: inline-block;
            padding: 4px 10px;
            font-weight: bold;
            border-radius: 3px;
            font-size: 0.9rem;
            color: #ffffff !important;
        }

        .rarity-item, .zone-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            background: #fff;
            margin-bottom: 5px;
            cursor: grab;
        }
        .rarity-item:active, .zone-item:active {
            cursor: grabbing;
        }

        .admin-controls {
            margin-top: 15px;
            padding: 15px;
            border: 1px dashed var(--border-color);
            background-color: #fff;
        }

        @keyframes rarityRotateAnim {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        @keyframes rarityFallAnim {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
    </style>
</head>
<body>

    <script type="application/json" id="ai-datastore-reader">
        { "description": "ESTE BLOQUE ES PARA QUE LA IA LEA EL ESTADO ACTUAL DE LA WIKI" }
    </script>

    <div id="auth-modal" class="modal-overlay">
        <div class="auth-container">
            <h2>Iniciar Sesión / Cuenta</h2>
            <p style="font-size: 0.85rem; color: #54595d;">Introduce tu usuario. Solo <strong>MrPhoenixWiki</strong> tiene privilegios de administrador.</p>
            <div class="form-group">
                <label for="username-input">Usuario:</label>
                <input type="text" id="username-input" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password-input">Contraseña:</label>
                <input type="password" id="password-input" autocomplete="current-password">
            </div>
            <div style="display: flex; gap: 10px;">
                <button class="primary" onclick="submitAuthModal()">Acceder</button>
                <button onclick="closeAuthModal()">Cancelar</button>
            </div>
            <p id="auth-error" style="color: red; font-size: 0.85rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <h1>Have a Bird 2 Wiki</h1>
            <div class="user-info">
                Usuario: <strong id="current-user-display"></strong> 
                <span id="admin-badge" style="color: #0645ad; font-weight: bold; display: none;">(Administrador)</span>
            </div>
        </header>

        <div class="container">
            <sidebar>
                <div class="sidebar-top" id="sidebar-categories-container"></div>
                <div class="sidebar-bottom">
                    <div id="admin-creators" style="display:none; flex-direction:column; gap:8px; margin-bottom: 10px;">
                        <button class="primary" style="width: 100%;" onclick="openCreateCategoryModal()">+ Crear Categoría</button>
                        <button class="primary" style="width: 100%;" onclick="openCreateSectionModal()">+ Crear Sección</button>
                    </div>
                    <h3 style="margin-top:0;">Sistema</h3>
                    <ul>
                        <li><a onclick="openAuthModal()">Iniciar Sesión / Cambiar Cuenta</a></li>
                        <li><a onclick="logoutAnonymous()" style="color: #ba0000;">Cambiar a Anónimo</a></li>
                    </ul>
                </div>
            </sidebar>

            <main id="main-content-area"></main>
        </div>
    </div>

    <script>
        const defaultData = {
            users: [],
            currentUser: null,
            rarities: [
                { name: "Común", style: "#717171", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" },
                { name: "Rara", style: "#0070dd", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" },
                { name: "Épica", style: "#a335ee", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" },
                { name: "Legendaria", style: "#ff8000", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise", vecX: 0, vecY: 0, animRepeat: "infinity" }
            ],
            zones: [
                { name: "Zona 1", style: "#36c", strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1 }
            ],
            categories: [
                { id: "nav", name: "Navegación" },
                { id: "sys", name: "Sistema" }
            ],
            sections: [
                { id: "como-se-juega", name: "Como se juega", type: "single", catId: "nav" },
                { id: "pajaros", name: "Pájaros", type: "posts", catId: "nav" },
                { id: "eventos", name: "Eventos", type: "single", catId: "nav" },
                { id: "info-juego", name: "Información del juego", type: "single", catId: "nav" },
                { id: "rarezas", name: "Rarezas", type: "rarities", catId: "sys" },
                { id: "zonas-sys", name: "Zonas", type: "zones", catId: "sys" }
            ],
            posts: {
                "pajaros": []
            },
            singleContent: {
                "como-se-juega": { title: "Como se juega", text: "Información inicial...", media: null, mediaType: null, bg360: null, linkUrl: "" },
                "eventos": { title: "Eventos", text: "Próximos eventos del juego...", media: null, mediaType: null, bg360: null, linkUrl: "" },
                "info-juego": { title: "Información del juego", text: "Detalles sobre el desarrollo...", media: null, mediaType: null, bg360: null, linkUrl: "" }
            }
        };

        let activeMediaData = {}; 
        let threeInstances = {}; 
        let activeRarityFilters = {}; 
        let collapsedCategories = {}; 
        let activeFormState = { type: null, rarity: null, editIndex: -1 };
        let currentSortMode = 'rarity';

        function loadDB() {
            let data = null;
            const globalKey = 'have_a_bird_wiki_global_db_v1';
            const savedGlobal = localStorage.getItem(globalKey);

            if (savedGlobal) {
                try { data = JSON.parse(savedGlobal); } catch(e){}
            }

            if (!data) {
                data = defaultData;
            } else {
                if (!data.categories) data.categories = defaultData.categories;
                if (!data.sections) data.sections = defaultData.sections;
                if (!data.posts) data.posts = defaultData.posts;
                if (!data.singleContent) data.singleContent = defaultData.singleContent;
                if (!data.rarities) data.rarities = defaultData.rarities;
                if (!data.zones) data.zones = defaultData.zones || defaultData.zones;
                
                // Asegurar que exista la sección de Zonas (tipo zones) en el sistema
                if (!data.sections.some(s => s.id === 'zonas-sys')) {
                    data.sections.push({ id: "zonas-sys", name: "Zonas", type: "zones", catId: "sys" });
                }

                data.rarities.forEach(r => {
                    if (r.strokeColor === undefined) r.strokeColor = "#000000";
                    if (r.strokeSize === undefined) r.strokeSize = 1;
                    if (r.strokeAlpha === undefined) r.strokeAlpha = 1;
                    if (r.animType === undefined) r.animType = "none";
                    if (r.animSpeed === undefined) r.animSpeed = 1;
                    if (r.animDir === undefined) r.animDir = "clockwise";
                    if (r.vecX === undefined) r.vecX = 0;
                    if (r.vecY === undefined) r.vecY = 0;
                    if (r.animRepeat === undefined) r.animRepeat = "infinity";
                });
                if (!data.users) data.users = [];
            }

            let currentUsr = null;
            const savedUserJson = localStorage.getItem('have_a_bird_active_user');
            if (savedUserJson) { try { currentUsr = JSON.parse(savedUserJson); } catch(e){} }

            if (!currentUsr) {
                currentUsr = { username: "Anónimo", password: "", isAdmin: false };
            }
            data.currentUser = currentUsr;
            saveDB(data);
            return data;
        }

        function saveDB(data) {
            try {
                localStorage.setItem('have_a_bird_wiki_global_db_v1', JSON.stringify(data));
                if (data.currentUser) {
                    localStorage.setItem('have_a_bird_active_user', JSON.stringify(data.currentUser));
                }
                const aiReader = document.getElementById('ai-datastore-reader');
                if (aiReader) aiReader.textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                alert('El archivo es demasiado pesado.');
            }
        }

        let db = loadDB();

        function openAuthModal() {
            document.getElementById('auth-modal').style.display = 'flex';
            if (db.currentUser && db.currentUser.username !== "Anónimo") {
                document.getElementById('username-input').value = db.currentUser.username;
            } else {
                document.getElementById('username-input').value = "";
            }
        }

        function closeAuthModal() {
            document.getElementById('auth-modal').style.display = 'none';
            document.getElementById('auth-error').innerText = "";
        }

        function submitAuthModal() {
            const userIn = document.getElementById('username-input').value.trim();
            const passIn = document.getElementById('password-input').value.trim();
            const errEl = document.getElementById('auth-error');

            if (!userIn) { errEl.innerText = "Introduce un nombre de usuario."; return; }

            const isTargetAdmin = (userIn === "MrPhoenixWiki");

            let user = db.users.find(u => u.username === userIn);
            if (user) {
                if (user.password && user.password !== passIn && passIn !== "") {
                    errEl.innerText = "Contraseña incorrecta.";
                    return;
                }
                user.isAdmin = isTargetAdmin;
            } else {
                user = { username: userIn, password: passIn, isAdmin: isTargetAdmin };
                db.users.push(user);
            }

            db.currentUser = user;
            saveDB(db);
            closeAuthModal();
            initApp();
        }

        function logoutAnonymous() {
            if (confirm("¿Cambiar a modo Anónimo?")) {
                db.currentUser = { username: "Anónimo", password: "", isAdmin: false };
                localStorage.setItem('have_a_bird_active_user', JSON.stringify(db.currentUser));
                initApp();
            }
        }

        function initApp() {
            document.getElementById('current-user-display').innerText = db.currentUser ? db.currentUser.username : "Anónimo";
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            
            document.getElementById('admin-badge').style.display = isAdmin ? 'inline' : 'none';
            document.getElementById('admin-creators').style.display = isAdmin ? 'flex' : 'none';

            const aiReader = document.getElementById('ai-datastore-reader');
            if (aiReader) aiReader.textContent = JSON.stringify(db, null, 2);

            renderSidebar();
            if (db.sections.length > 0) switchSection(db.sections[0].id);
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-categories-container');
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;

            container.innerHTML = db.categories.map(cat => {
                const catSections = db.sections.filter(s => s.catId === cat.id);
                let catDeleteBtn = (isAdmin && cat.id !== 'sys' && cat.id !== 'nav') ? `<button class="danger" style="padding:1px 4px; font-size:0.7rem;" onclick="deleteCategory('${cat.id}')">X</button>` : '';
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-top: 15px;">
                        <h3 style="margin:0; border:none; padding:0;">${cat.name}</h3>
                        ${catDeleteBtn}
                    </div>
                    <ul>
                        ${catSections.map(sec => {
                            let secDeleteBtn = (isAdmin && sec.id !== 'rarezas' && sec.id !== 'zonas-sys') ? `<button class="danger" style="padding: 1px 4px; font-size:0.7rem;" onclick="deleteSection('${sec.id}')">X</button>` : '';
                            return `
                                <li>
                                    <a onclick="switchSection('${sec.id}')">${sec.name}</a>
                                    ${secDeleteBtn}
                                </li>
                            `;
                        }).join('')}
                    </ul>
                `;
            }).join('');
        }

        function openCreateCategoryModal() {
            const name = prompt("Nombre de la nueva categoría:");
            if (!name) return;
            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '-');
            if (db.categories.some(c => c.id === id)) { alert("Ya existe."); return; }
            db.categories.push({ id, name }); saveDB(db); renderSidebar();
        }

        function deleteCategory(catId) {
            if (confirm("¿Borrar categoría?")) {
                db.sections = db.sections.filter(s => s.catId !== catId);
                db.categories = db.categories.filter(c => c.id !== catId);
                saveDB(db); renderSidebar();
                if (db.sections.length > 0) switchSection(db.sections[0].id);
            }
        }

        function openCreateSectionModal() {
            if (db.categories.length === 0) return;
            const name = prompt("Nombre de la nueva sección:");
            if (!name) return;
            let catOptions = db.categories.map(c => `${c.name} (ID: ${c.id})`).join('\n');
            const catChoice = prompt(`¿A qué categoría pertenece? Escribe el ID exacto:\n\n${catOptions}`);
            if (!db.categories.some(c => c.id === catChoice)) { alert("No válida."); return; }
            const typeChoice = prompt("¿Tipo de sección? 'posts' o 'single'").toLowerCase().trim();
            if (typeChoice !== 'posts' && typeChoice !== 'single') return;
            const id = name.toLowerCase().replace(/[^a-z0-9]/g, '-');
            db.sections.push({ id, name, type: typeChoice, catId: catChoice });
            if (typeChoice === 'posts') db.posts[id] = [];
            else db.singleContent[id] = { title: name, text: "Contenido...", media: null, mediaType: null, bg360: null, linkUrl: "" };
            saveDB(db); renderSidebar(); switchSection(id);
        }

        function deleteSection(sectionId) {
            if (confirm("¿Eliminar sección?")) {
                db.sections = db.sections.filter(s => s.id !== sectionId);
                delete db.posts[sectionId]; delete db.singleContent[sectionId];
                saveDB(db); renderSidebar();
                if (db.sections.length > 0) switchSection(db.sections[0].id);
            }
        }

        function switchSection(sectionId) {
            const sec = db.sections.find(s => s.id === sectionId);
            if (!sec) return;
            const mainArea = document.getElementById('main-content-area');
            if (sec.type === 'rarities') {
                mainArea.innerHTML = renderRaritiesSection();
                renderRaritiesList();
            } else if (sec.type === 'zones') {
                mainArea.innerHTML = renderZonesSection();
                renderZonesList();
            } else if (sec.type === 'single') {
                mainArea.innerHTML = renderSingleSection(sec);
                renderSingleContent(sec.id);
            } else if (sec.type === 'posts') {
                if (sectionId === 'pajaros') {
                    db.rarities.forEach(r => { if (activeRarityFilters[r.name] === undefined) activeRarityFilters[r.name] = true; });
                    mainArea.innerHTML = renderPajarosSection();
                    activeFormState = { type: null, rarity: null, editIndex: -1 };
                    renderPajaros();
                } else {
                    mainArea.innerHTML = renderGenericPostsSection(sec);
                    renderGenericPosts(sec.id);
                }
            }
        }

        function previewFileCustom(sectionId) {
            const fileInputId = sectionId === 'pajaros' ? 'pj-media-file' : (sectionId.startsWith('single-') ? `single-file-${sectionId}` : `post-file-${sectionId}`);
            const previewAreaId = sectionId === 'pajaros' ? 'pj-preview-area' : (sectionId.startsWith('single-') ? `single-preview-${sectionId}` : `post-preview-${sectionId}`);
            const fileInput = document.getElementById(fileInputId);
            const previewArea = document.getElementById(previewAreaId);

            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    activeMediaData[sectionId] = {
                        data: e.target.result,
                        type: file.type,
                        name: file.name
                    };
                    renderPreviewBoxCustom(sectionId);
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPreviewBoxCustom(sectionId) {
            const previewAreaId = sectionId === 'pajaros' ? 'pj-preview-area' : (sectionId.startsWith('single-') ? `single-preview-${sectionId}` : `post-preview-${sectionId}`);
            const previewArea = document.getElementById(previewAreaId);
            const media = activeMediaData[sectionId];
            if (!media || !media.data) { if(previewArea) previewArea.innerHTML = ''; return; }

            if(previewArea) {
                previewArea.innerHTML = `
                    <div class="preview-container">
                        <img src="${media.data}" style="width:60px;height:60px;object-fit:cover;">
                        <div style="flex-grow: 1; word-break: break-all;"><strong>Archivo:</strong> ${media.name}</div>
                        <button class="btn-remove-file" onclick="removeActiveFileCustom('${sectionId}')">X</button>
                    </div>
                `;
            }
        }

        function removeActiveFileCustom(sectionId) {
            activeMediaData[sectionId] = null;
            const fileInputId = sectionId === 'pajaros' ? 'pj-media-file' : (sectionId.startsWith('single-') ? `single-file-${sectionId}` : `post-file-${sectionId}`);
            const input = document.getElementById(fileInputId);
            if(input) input.value = '';
            renderPreviewBoxCustom(sectionId);
        }

        // --- RAREZAS ---
        function renderRaritiesSection() {
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            let adminForm = isAdmin ? `
                <div class="admin-controls">
                    <h3 id="rarity-form-title">Crear / Editar Rareza</h3>
                    <input type="hidden" id="rz-edit-index" value="-1">
                    <div class="form-group"><label>Nombre de la Rareza:</label><input type="text" id="rz-name"></div>
                    <div class="form-group"><label>Estilo (Color o Gradiente CSS):</label><input type="text" id="rz-style"></div>
                    <button class="primary" onclick="saveRarity()">Guardar Rareza</button>
                    <button id="rz-cancel-btn" onclick="cancelEditRarity()" style="display:none;">Cancelar Edición</button>
                </div>
            ` : '';

            return `
                <section class="section-content active">
                    <h2>Rarezas</h2>
                    <p>Gestiona las rarezas del juego:</p>
                    <div id="rarities-list"></div>
                    ${adminForm}
                </section>
            `;
        }

        function renderRaritiesList() {
            const container = document.getElementById('rarities-list');
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;

            if(!container) return;
            container.innerHTML = db.rarities.map((r, i) => {
                let size = r.strokeSize || 1;
                let strokeColor = r.strokeColor || '#000000';
                let alpha = r.strokeAlpha !== undefined ? r.strokeAlpha : 1;
                let rgb = hexToRgbStr(strokeColor);
                let strokeCss = `text-shadow: ${size}px 0 rgba(${rgb}, ${alpha}), -${size}px 0 rgba(${rgb}, ${alpha}), 0 ${size}px rgba(${rgb}, ${alpha}), 0 -${size}px rgba(${rgb}, ${alpha});`;

                let adminButtons = isAdmin ? `
                    <div>
                        <button onclick="event.stopPropagation(); startEditRarity(${i})">Editar</button>
                        <button class="danger" onclick="event.stopPropagation(); deleteRarity(${i})">Eliminar</button>
                    </div>
                ` : '';

                return `
                    <div class="rarity-item" onclick="startEditRarity(${i})">
                        <div>
                            <span class="rarity-badge" style="background: ${r.style}; color: #ffffff !important; ${strokeCss}">${i+1}. ${r.name}</span>
                            <span style="font-size: 0.85rem; color: #54595d; margin-left: 10px;">Estilo: <code>${r.style}</code></span>
                        </div>
                        ${adminButtons}
                    </div>
                `;
            }).join('');
        }

        function hexToRgbStr(hex) {
            let c = hex.replace('#','');
            if(c.length===3) c = c.split('').map(x=>x+x).join('');
            let num = parseInt(c,16);
            return `${(num>>16)&255}, ${(num>>8)&255}, ${num&255}`;
        }

        function saveRarity() {
            const name = document.getElementById('rz-name').value;
            const style = document.getElementById('rz-style').value;
            if (!name || !style) { alert('Ingresa el nombre y el estilo.'); return; }

            const editIdx = parseInt(document.getElementById('rz-edit-index').value);
            const rarityObj = { name, style, strokeColor: "#000000", strokeSize: 1, strokeAlpha: 1, animType: "none", animSpeed: 1, animDir: "clockwise" };

            if (editIdx >= 0) db.rarities[editIdx] = rarityObj;
            else db.rarities.push(rarityObj);

            saveDB(db);
            cancelEditRarity();
            renderRaritiesList();
        }

        function startEditRarity(index) {
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            if (!isAdmin) return;

            const r = db.rarities[index];
            document.getElementById('rz-edit-index').value = index;
            document.getElementById('rz-name').value = r.name;
            document.getElementById('rz-style').value = r.style;
            document.getElementById('rarity-form-title').innerText = 'Editar Rareza: ' + r.name;
            document.getElementById('rz-cancel-btn').style.display = 'inline-block';
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        function cancelEditRarity() {
            document.getElementById('rz-edit-index').value = -1;
            document.getElementById('rz-name').value = '';
            document.getElementById('rz-style').value = '';
            document.getElementById('rarity-form-title').innerText = 'Crear / Editar Rareza';
            document.getElementById('rz-cancel-btn').style.display = 'none';
        }

        function deleteRarity(index) {
            if (confirm("¿Eliminar rareza?")) {
                db.rarities.splice(index, 1);
                saveDB(db);
                renderRaritiesList();
            }
        }

        // --- PÁJAROS ---
        function renderDynamicPajaroForm(isEditing, targetRarity, editIndex) {
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            if (!isAdmin) return '';

            if(!db.zones) db.zones = [{ name: "Zona 1", style: "#36c" }];

            let pData = { title: '', zone: db.zones[0]?.name || 'Zona 1', money: '', text: '', linkUrl: '', rarity: targetRarity || (db.rarities[0] ? db.rarities[0].name : '') };
            if (isEditing && editIndex >= 0) {
                pData = db.posts['pajaros'][editIndex];
            }

            return `
                <div class="admin-controls" style="margin-top: 15px; border: 2px solid #36c;">
                    <h3>${isEditing ? 'Editar Pájaro' : 'Añadir Nuevo Pájaro en ' + targetRarity}</h3>
                    <div class="form-group"><label>Nombre:</label><input type="text" id="dyn-pj-title" value="${pData.title}"></div>
                    <div class="form-group"><label>Rareza:</label>
                        <select id="dyn-pj-rarity">
                            ${db.rarities.map(r => `<option value="${r.name}" ${pData.rarity === r.name ? 'selected' : ''}>${r.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label>Zona:</label>
                        <select id="dyn-pj-zone">
                            ${db.zones.map(z => `<option value="${z.name}" ${pData.zone === z.name ? 'selected' : ''}>${z.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label>Dinero por segundo ($/sec):</label><input type="text" id="dyn-pj-money" value="${pData.money || ''}"></div>
                    <div class="form-group"><label>Información:</label><textarea id="dyn-pj-text" rows="4">${pData.text}</textarea></div>
                    <div class="form-group"><label>Multimedia:</label><input type="file" id="pj-media-file" accept="image/*,video/*" onchange="previewFileCustom('pajaros')"><div id="pj-preview-area"></div></div>
                    <div class="form-group"><label>Enlace Opcional:</label><input type="text" id="dyn-pj-link" value="${pData.linkUrl || ''}" placeholder="https://..."></div>
                    <div style="display: flex; gap: 10px;">
                        <button class="primary" onclick="saveDynamicPajaro(${isEditing ? editIndex : -1})">Guardar</button>
                        <button onclick="activeFormState = {type: null, rarity: null, editIndex: -1}; renderPajaros();">Cancelar</button>
                    </div>
                </div>
            `;
        }

        function saveDynamicPajaro(editIndex) {
            const title = document.getElementById('dyn-pj-title').value;
            const rarity = document.getElementById('dyn-pj-rarity').value;
            const zone = document.getElementById('dyn-pj-zone').value;
            const money = document.getElementById('dyn-pj-money').value;
            const text = document.getElementById('dyn-pj-text').value;
            const linkUrl = document.getElementById('dyn-pj-link').value;

            if (!title || !money || !text) { alert('Completa los campos requeridos.'); return; }

            let mediaData = editIndex >= 0 ? db.posts['pajaros'][editIndex].media : null;
            let mediaType = editIndex >= 0 ? db.posts['pajaros'][editIndex].mediaType : null;

            if (activeMediaData['pajaros']) {
                mediaData = activeMediaData['pajaros'].data;
                mediaType = activeMediaData['pajaros'].type;
            }

            const pajaroObj = { title, rarity, zone, money, text, linkUrl, media: mediaData, mediaType: mediaType };
            if (editIndex >= 0) {
                db.posts['pajaros'][editIndex] = pajaroObj;
            } else {
                if(!db.posts['pajaros']) db.posts['pajaros'] = [];
                db.posts['pajaros'].push(pajaroObj);
            }

            saveDB(db);
            activeFormState = { type: null, rarity: null, editIndex: -1 };
            activeMediaData['pajaros'] = null;
            renderPajaros();
        }

        function renderRarityCheckboxes() {
            const container = document.getElementById('rarity-checkboxes-container');
            if(!container) return;
            container.innerHTML = db.rarities.map(r => {
                let size = r.strokeSize || 1;
                let strokeColor = r.strokeColor || '#000000';
                let alpha = r.strokeAlpha !== undefined ? r.strokeAlpha : 1;
                let rgb = hexToRgbStr(strokeColor);
                let strokeCss = `text-shadow: ${size}px 0 rgba(${rgb}, ${alpha}), -${size}px 0 rgba(${rgb}, ${alpha}), 0 ${size}px rgba(${rgb}, ${alpha}), 0 -${size}px rgba(${rgb}, ${alpha});`;

                return `
                    <label class="rarity-filter-item">
                        <input type="checkbox" ${activeRarityFilters[r.name] ? 'checked' : ''} onchange="toggleRarityFilter('${r.name}')">
                        <span class="rarity-badge" style="background:${r.style}; color:#ffffff !important; ${strokeCss} font-size:0.75rem; padding:2px 6px;">${r.name}</span>
                    </label>
                `;
            }).join('');
        }

        function toggleRarityFilter(name) {
            activeRarityFilters[name] = !activeRarityFilters[name];
            renderPajaros();
        }

        function renderPajaros() {
            renderRarityCheckboxes();
            const container = document.getElementById('posts-pajaros');
            const searchVal = document.getElementById('search-pajaros')?.value.toLowerCase() || "";
            const posts = db.posts['pajaros'] || [];

            let htmlOutput = '';
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;

            if (currentSortMode === 'rarity') {
                db.rarities.forEach((rObj) => {
                    let rPosts = posts.filter(p => p.rarity === rObj.name);

                    if (searchVal) {
                        rPosts = rPosts.filter(p => p.title.toLowerCase().includes(searchVal));
                    }

                    rPosts = rPosts.filter(p => activeRarityFilters[p.rarity] !== false);

                    rPosts.sort((a, b) => {
                        let valA = parseMoneyValue(a.money);
                        let valB = parseMoneyValue(b.money);
                        return valA - valB;
                    });

                    let isCollapsed = collapsedCategories[rObj.name] || false;
                    let size = rObj.strokeSize || 1;
                    let strokeColor = rObj.strokeColor || '#000000';
                    let alpha = rObj.strokeAlpha !== undefined ? rObj.strokeAlpha : 1;
                    let rgb = hexToRgbStr(strokeColor);
                    let strokeCss = `text-shadow: ${size}px 0 rgba(${rgb}, ${alpha}), -${size}px 0 rgba(${rgb}, ${alpha}), 0 ${size}px rgba(${rgb}, ${alpha}), 0 -${size}px rgba(${rgb}, ${alpha});`;

                    let addBtnHtml = isAdmin ? `<button class="primary" style="font-size:0.75rem; padding:2px 6px;" onclick="event.stopPropagation(); toggleAddForm('${rObj.name}')">+ Añadir en ${rObj.name}</button>` : '';
                    let addFormHtml = (activeFormState.type === 'create' && activeFormState.rarity === rObj.name) ? renderDynamicPajaroForm(false, rObj.name, -1) : '';

                    let contentHtml = '';
                    if (rPosts.length === 0) {
                        contentHtml = `<p style="color: #72777d; font-style: italic; margin: 0 0 10px 0;">No hay pájaros en esta rareza todavía.</p>`;
                    } else {
                        contentHtml = rPosts.map(p => {
                            let originalIdx = posts.indexOf(p);
                            let cardHtml = renderPostCardHTML(p, 'pajaros', originalIdx);
                            let editFormHtml = (activeFormState.type === 'edit' && activeFormState.editIndex === originalIdx) ? renderDynamicPajaroForm(true, rObj.name, originalIdx) : '';
                            return cardHtml + editFormHtml;
                        }).join('');
                    }

                    htmlOutput += `
                        <div class="rarity-category-group">
                            <div class="rarity-category-header" style="background: ${rObj.style}; ${strokeCss}" onclick="toggleCategoryCollapse('${rObj.name}')">
                                <span>${isCollapsed ? '▶' : '▼'} Rareza: ${rObj.name} (${rPosts.length})</span>
                                ${addBtnHtml}
                            </div>
                            <div class="rarity-category-body ${isCollapsed ? 'collapsed' : ''}">
                                ${contentHtml}
                                ${addFormHtml}
                            </div>
                        </div>
                    `;
                });
            } else if (currentSortMode === 'zone') {
                if(!db.zones) db.zones = [{ name: "Zona 1", style: "#36c" }];
                db.zones.forEach((zObj) => {
                    let zPosts = posts.filter(p => (p.zone || 'Zona 1') === zObj.name);
                    if (searchVal) zPosts = zPosts.filter(p => p.title.toLowerCase().includes(searchVal));
                    zPosts = zPosts.filter(p => activeRarityFilters[p.rarity] !== false);
                    zPosts.sort((a, b) => parseMoneyValue(a.money) - parseMoneyValue(b.money));

                    let contentHtml = zPosts.length === 0 ? `<p style="color: #72777d; font-style: italic; margin: 0 0 10px 0;">No hay pájaros en esta zona.</p>` :
                        zPosts.map(p => {
                            let originalIdx = posts.indexOf(p);
                            let cardHtml = renderPostCardHTML(p, 'pajaros', originalIdx);
                            let editFormHtml = (activeFormState.type === 'edit' && activeFormState.editIndex === originalIdx) ? renderDynamicPajaroForm(true, null, originalIdx) : '';
                            return cardHtml + editFormHtml;
                        }).join('');

                    htmlOutput += `
                        <div class="rarity-category-group">
                            <div class="rarity-category-header" style="background: ${zObj.style};">
                                <span>Zona: ${zObj.name} (${zPosts.length})</span>
                            </div>
                            <div class="rarity-category-body">
                                ${contentHtml}
                            </div>
                        </div>
                    `;
                });
            } else {
                let sortedPosts = [...posts];
                if (searchVal) sortedPosts = sortedPosts.filter(p => p.title.toLowerCase().includes(searchVal));
                sortedPosts = sortedPosts.filter(p => activeRarityFilters[p.rarity] !== false);

                sortedPosts.sort((a, b) => {
                    let valA = parseMoneyValue(a.money);
                    let valB = parseMoneyValue(b.money);
                    return currentSortMode === 'money-asc' ? valA - valB : valB - valA;
                });

                let contentHtml = sortedPosts.length === 0 ? `<p style="color: #72777d; font-style: italic; margin: 0 0 10px 0;">No hay pájaros.</p>` :
                    sortedPosts.map(p => {
                        let originalIdx = posts.indexOf(p);
                        let cardHtml = renderPostCardHTML(p, 'pajaros', originalIdx);
                        let editFormHtml = (activeFormState.type === 'edit' && activeFormState.editIndex === originalIdx) ? renderDynamicPajaroForm(true, null, originalIdx) : '';
                        return cardHtml + editFormHtml;
                    }).join('');

                htmlOutput += `
                    <div class="rarity-category-group">
                        <div class="rarity-category-header" style="background: #36c;">
                            <span>Listado Ordenado por Dinero (${sortedPosts.length})</span>
                        </div>
                        <div class="rarity-category-body">
                            ${contentHtml}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = htmlOutput;

            if(activeFormState.type !== null) {
                setTimeout(() => renderPreviewBoxCustom('pajaros'), 50);
            }
        }

        function toggleCategoryCollapse(name) {
            collapsedCategories[name] = !collapsedCategories[name];
            renderPajaros();
        }

        function renderPostCardHTML(p, sectionId, index) {
            const isAdmin = db.currentUser ? (db.currentUser.username === "MrPhoenixWiki") : false;
            const rObj = sectionId === 'pajaros' ? db.rarities.find(r => r.name === p.rarity) : null;
            const zObj = sectionId === 'pajaros' && db.zones ? db.zones.find(z => z.name === p.zone) : null;
            
            let strokeCss = '';
            if (rObj) {
                let size = rObj.strokeSize || 1;
                let strokeColor = rObj.strokeColor || '#000000';
                let alpha = rObj.strokeAlpha !== undefined ? rObj.strokeAlpha : 1;
                let rgb = hexToRgbStr(strokeColor);
                strokeCss = `text-shadow: ${size}px 0 rgba(${rgb}, ${alpha}), -${size}px 0 rgba(${rgb}, ${alpha}), 0 ${size}px rgba(${rgb}, ${alpha}), 0 -${size}px rgba(${rgb}, ${alpha});`;
            }
            const styleAttr = rObj ? `background: ${rObj.style}; ${strokeCss}` : 'background: #333;';
            const zoneStyleAttr = zObj ? `background: ${zObj.style};` : 'background: #717171;';
            
            const extraInfo = sectionId === 'pajaros' ? `<p><strong>Rareza:</strong> <span class="rarity-badge" style="${styleAttr}">${p.rarity}</span> | <strong>Zona:</strong> <span class="zone-badge" style="${zoneStyleAttr}">${p.zone || 'Zona 1'}</span></p><p><strong>Dinero por seg:</strong> $${p.money}/sec</p>` : '';
            
            let adminButtons = isAdmin ? `<div style="margin-top: 15px; display: flex; gap: 10px;"><button onclick="toggleEditForm(${index})">Editar</button><button class="danger" onclick="deleteGenericPost('${sectionId}', ${index})">Eliminar</button></div>` : '';

            return `<div class="post-card"><div class="post-left"><h3 style="margin-top:0;">${p.title}</h3>${extraInfo}<p style="white-space: pre-wrap;">${p.text}</p>${generateLinkHTML(p.linkUrl)}${adminButtons}</div><div class="post-right">${generateMediaHTML(p.media, p.mediaType, p.bg360, `${sectionId}-${index}`)}</div></div>`;
        }

        function deleteGenericPost(sectionId, index) {
            if (confirm("¿Eliminar post?")) { 
                db.posts[sectionId].splice(index, 1); 
                saveDB(db); 
                renderPajaros(); 
            }
        }

        window.onload = function() { initApp(); };
    </script>
</body>
</html>
