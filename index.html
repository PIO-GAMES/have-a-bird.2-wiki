<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Have a Bird 2 Wiki</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --link-color: #0645ad;
            --border-color: #a2a9b1;
            --box-bg: #f8f9fa;
            --hover-bg: #eaecf0;
        }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 0; line-height: 1.6; }
        header { border-bottom: 1px solid var(--border-color); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; background-color: #ffffff; }
        h1 { font-size: 1.8rem; margin: 0; font-weight: normal; }
        .user-info { font-size: 0.9rem; color: #54595d; }
        .container { display: flex; min-height: calc(100vh - 70px); }
        sidebar { width: 270px; border-right: 1px solid var(--border-color); padding: 20px 15px; background-color: #f6f6f6; box-sizing: border-box; flex-shrink: 0; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar-top { flex-grow: 1; overflow-y: auto; }
        .sidebar-bottom { border-top: 1px solid var(--border-color); padding-top: 15px; margin-top: 15px; }
        sidebar h3 { font-size: 0.85rem; text-transform: uppercase; color: #54595d; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-top: 15px; }
        sidebar ul { list-style: none; padding: 0; margin: 0 0 15px 0; min-height: 20px; }
        sidebar li { margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; background: #fff; border: 1px solid transparent; padding: 2px 4px; cursor: grab; }
        sidebar a { color: var(--link-color); text-decoration: none; cursor: pointer; display: block; padding: 3px 6px; flex-grow: 1; }
        sidebar a:hover { text-decoration: underline; }
        main { flex-grow: 1; padding: 30px; max-width: 900px; box-sizing: border-box; }
        .section-content { display: none; }
        .section-content.active { display: block; }
        h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; margin-top: 0; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .auth-container { width: 350px; border: 1px solid var(--border-color); padding: 30px; background-color: var(--box-bg); }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px; border: 1px solid var(--border-color); box-sizing: border-box; background: #fff; }
        button { background-color: #f8f9fa; border: 1px solid #72777d; padding: 6px 12px; cursor: pointer; font-size: 0.9rem; }
        button:hover { background-color: var(--hover-bg); }
        button.primary { background-color: #36c; color: white; border-color: #36c; }
        button.primary:hover { background-color: #2a4b8d; }
        button.danger { color: #ba0000; border-color: #ba0000; }
        button.danger:hover { background-color: #fdf2f2; }
        .search-box { margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        .search-box input { flex-grow: 1; padding: 6px; border: 1px solid var(--border-color); }
        .search-box select { padding: 6px; border: 1px solid var(--border-color); background: #fff; }
        .rarity-filter-bar { display: flex; flex-wrap: wrap; gap: 10px; background: var(--box-bg); border: 1px solid var(--border-color); padding: 12px; margin-bottom: 20px; align-items: center; }
        .rarity-filter-item { display: flex; align-items: center; gap: 5px; font-size: 0.85rem; cursor: pointer; background: #fff; padding: 4px 8px; border: 1px solid var(--border-color); }
        .rarity-category-group { margin-bottom: 20px; border: 1px solid var(--border-color); background: #fff; }
        .rarity-category-header { padding: 10px 15px; font-weight: bold; display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; color: #ffffff !important; }
        .rarity-category-body { padding: 15px; border-top: 1px solid var(--border-color); background: #fafafa; }
        .post-card { border: 1px solid var(--border-color); padding: 20px; margin-bottom: 15px; background: #fff; display: flex; justify-content: space-between; gap: 20px; }
        .post-left { flex-grow: 1; }
        .post-right { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; }
        .media-container { width: 100%; height: 200px; border: 1px solid var(--border-color); background: #000; position: relative; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .media-container img { width: 100%; height: 100%; object-fit: contain; }
        .preview-container { display: flex; align-items: center; gap: 10px; margin-top: 8px; padding: 8px; border: 1px dashed var(--border-color); background: #fff; font-size: 0.85rem; }
        .btn-remove-file { background: #ba0000; color: white; border: none; padding: 2px 6px; font-weight: bold; cursor: pointer; border-radius: 3px; }
        .rarity-badge, .zone-badge { display: inline-block; padding: 4px 10px; font-weight: bold; border-radius: 3px; font-size: 0.9rem; color: #ffffff !important; }
        .rarity-item, .zone-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-bottom: 1px solid var(--border-color); background: #fff; margin-bottom: 5px; }
        .admin-controls { margin-top: 15px; padding: 15px; border: 1px dashed var(--border-color); background-color: #fff; }
    </style>
</head>
<body>

    <div id="auth-modal" class="modal-overlay">
        <div class="auth-container">
            <h2>Iniciar Sesión</h2>
            <div class="form-group"><label>Usuario:</label><input type="text" id="username-input"></div>
            <div class="form-group"><label>Contraseña:</label><input type="password" id="password-input"></div>
            <div style="display: flex; gap: 10px;">
                <button class="primary" onclick="submitAuthModal()">Acceder</button>
                <button onclick="closeAuthModal()">Cancelar</button>
            </div>
            <p id="auth-error" style="color: red; font-size: 0.85rem; margin-top: 10px;"></p>
        </div>
    </div>

    <div id="app-screen">
        <header>
            <h1>Have a Bird 2 Wiki</h1>
            <div class="user-info">
                Usuario: <strong id="current-user-display"></strong> 
                <span id="admin-badge" style="color: #0645ad; font-weight: bold; display: none;">(Administrador)</span>
            </div>
        </header>

        <div class="container">
            <sidebar>
                <div class="sidebar-top" id="sidebar-categories-container"></div>
                <div class="sidebar-bottom">
                    <div id="admin-creators" style="display:none; flex-direction:column; gap:8px; margin-bottom: 10px;">
                        <button class="primary" style="width: 100%;" onclick="openCreateCategoryModal()">+ Crear Categoría</button>
                        <button class="primary" style="width: 100%;" onclick="openCreateSectionModal()">+ Crear Sección</button>
                    </div>
                    <h3 style="margin-top:0;">Sistema</h3>
                    <ul>
                        <li><a onclick="openAuthModal()">Iniciar Sesión</a></li>
                        <li><a onclick="logoutAnonymous()" style="color: #ba0000;">Cerrar Sesión</a></li>
                    </ul>
                </div>
            </sidebar>
            <main id="main-content-area"></main>
        </div>
    </div>

    <script>
        const defaultData = {
            users: [{ username: "MrPhoenixWiki", password: "787878", isAdmin: true }],
            currentUser: { username: "MrPhoenixWiki", password: "787878", isAdmin: true },
            rarities: [
                { name: "Común", style: "#d4baa0" }, { name: "InComun", style: "#bbff4b" },
                { name: "Rare", style: "#0070dd" }, { name: "Épic", style: "#a335ee" },
                { name: "Legendary", style: "#eeff8c" }, { name: "Mythic", style: "#ed1c24" },
                { name: "Good Bird", style: "#ff7f27" }, { name: "Secret", style: "#000000" },
                { name: "Divine", style: "#6500cb" }, { name: "Ultra Galactic", style: "#45007a" },
                { name: "Digital", style: "#00e400" }, { name: "Admin", style: "#ff0000" },
                { name: "Hallowen", style: "#ff7f27" }, { name: "Pascua", style: "#b97a57" },
                { name: "Cristmas", style: "#00e400" }, { name: "San Valentin", style: "#ffaec9" },
                { name: "New Year", style: "#a349a4" }
            ],
            zones: [
                { name: "Zona 1", style: "#717171" },
                { name: "Zona 2", style: "#00a2e8" }
            ],
            categories: [{ id: "nav", name: "Navegación" }, { id: "sys", name: "Sistema" }],
            sections: [
                { id: "como-se-juega", name: "Como se juega", type: "single", catId: "nav" },
                { id: "pajaros", name: "Pájaros", type: "posts", catId: "nav" },
                { id: "eventos", name: "Eventos", type: "single", catId: "nav" },
                { id: "info-juego", name: "Información del juego", type: "single", catId: "nav" },
                { id: "rarezas", name: "Rarezas", type: "rarities", catId: "sys" },
                { id: "zonas", name: "Zonas", type: "zones", catId: "sys" }
            ],
            posts: { "pajaros": [] },
            singleContent: {
                "como-se-juega": { title: "Como se juega", text: "Información inicial...", media: null, mediaType: null },
                "eventos": { title: "Eventos", text: "Próximos eventos...", media: null, mediaType: null },
                "info-juego": { title: "Información del juego", text: "Detalles...", media: null, mediaType: null }
            }
        };

        let activeMediaData = {}, activeRarityFilters = {}, activeFormState = { type: null, rarity: null, editIndex: -1 };
        let currentSortMode = 'rarity';

        function loadDB() {
            let data = null;
            const savedGlobal = localStorage.getItem('have_a_bird_wiki_global_db_v1');
            if (savedGlobal) { try { data = JSON.parse(savedGlobal); } catch(e){} }
            if (!data) data = defaultData;
            if (!data.zones) data.zones = defaultData.zones;
            data.currentUser = { username: "MrPhoenixWiki", password: "787878", isAdmin: true };
            saveDB(data);
            return data;
        }

        function saveDB(data) {
            localStorage.setItem('have_a_bird_wiki_global_db_v1', JSON.stringify(data));
        }

        let db = loadDB();

        function openAuthModal() { document.getElementById('auth-modal').style.display = 'flex'; }
        function closeAuthModal() { document.getElementById('auth-modal').style.display = 'none'; document.getElementById('auth-error').innerText = ""; }
        function submitAuthModal() {
            const userIn = document.getElementById('username-input').value.trim();
            const passIn = document.getElementById('password-input').value.trim();
            if (userIn === "MrPhoenixWiki" && passIn === "787878") {
                db.currentUser = { username: userIn, password: passIn, isAdmin: true };
                saveDB(db); closeAuthModal(); initApp();
            } else { document.getElementById('auth-error').innerText = "Datos incorrectos."; }
        }
        function logoutAnonymous() {
            db.currentUser = { username: "Anónimo", password: "", isAdmin: false };
            saveDB(db); initApp();
        }

        function initApp() {
            document.getElementById('current-user-display').innerText = db.currentUser ? db.currentUser.username : "Anónimo";
            const isAdmin = db.currentUser ? db.currentUser.isAdmin : false;
            document.getElementById('admin-badge').style.display = isAdmin ? 'inline' : 'none';
            document.getElementById('admin-creators').style.display = isAdmin ? 'flex' : 'none';
            renderSidebar();
            if (db.sections.length > 0) switchSection(db.sections[0].id);
        }

        function renderSidebar() {
            const container = document.getElementById('sidebar-categories-container');
            const isAdmin = db.currentUser ? db.currentUser.isAdmin : false;
            container.innerHTML = db.categories.map(cat => {
                const catSections = db.sections.filter(s => s.catId === cat.id);
                let catDeleteBtn = (isAdmin && cat.id !== 'sys' && cat.id !== 'nav') ? `<button class="danger" style="padding:1px 4px; font-size:0.7rem;" onclick="deleteCategory('${cat.id}')">X</button>` : '';
                return `
                    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid var(--border-color); padding-bottom: 4px; margin-top: 15px;">
                        <h3 style="margin:0; border:none; padding:0;">${cat.name}</h3>${catDeleteBtn}
                    </div>
                    <ul>${catSections.map(sec => `<li><a onclick="switchSection('${sec.id}')">${sec.name}</a></li>`).join('')}</ul>
                `;
            }).join('');
        }

        function switchSection(sectionId) {
            const sec = db.sections.find(s => s.id === sectionId);
            if (!sec) return;
            const mainArea = document.getElementById('main-content-area');
            if (sec.type === 'rarities') {
                mainArea.innerHTML = `<h2>Rarezas</h2><div id="rarities-list"></div>` + (db.currentUser?.isAdmin ? `
                    <div class="admin-controls">
                        <h3>Añadir Rareza</h3>
                        <div class="form-group"><label>Nombre:</label><input type="text" id="rz-name"></div>
                        <div class="form-group"><label>Color o Gradiente:</label><input type="text" id="rz-style"></div>
                        <button class="primary" onclick="saveRarity()">Guardar Rareza</button>
                    </div>` : '');
                renderRaritiesList();
            } else if (sec.type === 'zones') {
                mainArea.innerHTML = `<h2>Zonas</h2><div id="zones-list"></div>` + (db.currentUser?.isAdmin ? `
                    <div class="admin-controls">
                        <h3>Añadir Zona</h3>
                        <div class="form-group"><label>Nombre de Zona:</label><input type="text" id="zn-name"></div>
                        <div class="form-group"><label>Color o Gradiente:</label><input type="text" id="zn-style"></div>
                        <button class="primary" onclick="saveZone()">Guardar Zona</button>
                    </div>` : '');
                renderZonesList();
            } else if (sec.type === 'single') {
                mainArea.innerHTML = `<h2>${sec.name}</h2><div id="single-display-${sec.id}"></div>`;
                renderSingleContent(sec.id);
            } else if (sec.type === 'posts') {
                if (sectionId === 'pajaros') {
                    db.rarities.forEach(r => { if (activeRarityFilters[r.name] === undefined) activeRarityFilters[r.name] = true; });
                    mainArea.innerHTML = `
                        <h2>Pájaros</h2>
                        <div class="search-box">
                            <input type="text" id="search-pajaros" placeholder="Buscar pájaro..." oninput="renderPajaros()">
                            <select id="sort-mode-select" onchange="changeSortMode(this.value)">
                                <option value="rarity">Ordenar por Rareza</option>
                                <option value="zone">Ordenar por Zona</option>
                                <option value="money-asc">Dinero: Menor a Mayor</option>
                                <option value="money-desc">Dinero: Mayor a Menor</option>
                            </select>
                        </div>
                        <div class="rarity-filter-bar">
                            <div style="width:100%; display:flex; justify-content:space-between; align-items:center; margin-bottom:5px;">
                                <strong>Filtrar por Rarezas:</strong>
                                <div>
                                    <button onclick="setAllRarityFilters(true)">Seleccionar todas</button>
                                    <button onclick="setAllRarityFilters(false)">Deseleccionar todas</button>
                                </div>
                            </div>
                            <div id="rarity-checkboxes-container" style="display:flex; flex-wrap:wrap; gap:8px;"></div>
                        </div>
                        <div id="posts-pajaros"></div>
                    `;
                    document.getElementById('sort-mode-select').value = currentSortMode;
                    activeFormState = { type: null, rarity: null, editIndex: -1 };
                    renderPajaros();
                }
            }
        }

        function changeSortMode(mode) {
            currentSortMode = mode;
            renderPajaros();
        }

        function setAllRarityFilters(val) {
            db.rarities.forEach(r => { activeRarityFilters[r.name] = val; });
            renderPajaros();
        }

        function previewFileCustom(sectionId) {
            const fileInput = document.getElementById('pj-media-file');
            if (fileInput && fileInput.files && fileInput.files[0]) {
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    activeMediaData[sectionId] = { data: e.target.result, type: file.type, name: file.name };
                    document.getElementById('pj-preview-area').innerHTML = `<div class="preview-container"><img src="${e.target.result}" style="width:60px;height:60px;object-fit:cover;"><span>${file.name}</span><button class="btn-remove-file" onclick="activeMediaData['pajaros']=null;document.getElementById('pj-preview-area').innerHTML=''">X</button></div>`;
                };
                reader.readAsDataURL(file);
            }
        }

        function renderRaritiesList() {
            const container = document.getElementById('rarities-list');
            if(!container) return;
            container.innerHTML = db.rarities.map((r, i) => `
                <div class="rarity-item">
                    <span class="rarity-badge" style="background:${r.style};">${i+1}. ${r.name}</span>
                    ${db.currentUser?.isAdmin ? `<button class="danger" onclick="deleteRarity(${i})">Eliminar</button>` : ''}
                </div>
            `).join('');
        }

        function saveRarity() {
            const name = document.getElementById('rz-name').value;
            const style = document.getElementById('rz-style').value;
            if (!name || !style) return;
            db.rarities.push({ name, style });
            saveDB(db); renderRaritiesList();
        }

        function deleteRarity(idx) { db.rarities.splice(idx, 1); saveDB(db); renderRaritiesList(); }

        function renderZonesList() {
            const container = document.getElementById('zones-list');
            if(!container) return;
            container.innerHTML = db.zones.map((z, i) => `
                <div class="zone-item">
                    <span class="zone-badge" style="background:${z.style};">${i+1}. ${z.name}</span>
                    ${db.currentUser?.isAdmin ? `<button class="danger" onclick="deleteZone(${i})">Eliminar</button>` : ''}
                </div>
            `).join('');
        }

        function saveZone() {
            const name = document.getElementById('zn-name').value;
            const style = document.getElementById('zn-style').value;
            if (!name || !style) return;
            db.zones.push({ name, style });
            saveDB(db); renderZonesList();
        }

        function deleteZone(idx) { db.zones.splice(idx, 1); saveDB(db); renderZonesList(); }

        function renderSingleContent(sectionId) {
            if (!db.singleContent[sectionId]) db.singleContent[sectionId] = { title: "Nuevo", text: "", media: null };
            const item = db.singleContent[sectionId];
            document.getElementById(`single-display-${sectionId}`).innerHTML = `<h3>${item.title}</h3><p>${item.text}</p>`;
        }

        function toggleAddForm(rarityName) {
            activeFormState = (activeFormState.type === 'create' && activeFormState.rarity === rarityName) ? { type: null, rarity: null, editIndex: -1 } : { type: 'create', rarity: rarityName, editIndex: -1 };
            renderPajaros();
        }

        function toggleEditForm(index) {
            activeFormState = (activeFormState.type === 'edit' && activeFormState.editIndex === index) ? { type: null, rarity: null, editIndex: -1 } : { type: 'edit', rarity: null, editIndex: index };
            const p = db.posts['pajaros'][index];
            if (p && p.media) activeMediaData['pajaros'] = { data: p.media, type: p.mediaType || 'image/png', name: 'Actual' };
            else activeMediaData['pajaros'] = null;
            renderPajaros();
        }

        function renderDynamicPajaroForm(isEditing, targetRarity, editIndex) {
            let pData = { title: '', zone: db.zones[0]?.name || '', money: '', text: '', rarity: targetRarity || db.rarities[0]?.name || '' };
            if (isEditing && editIndex >= 0) {
                pData = db.posts['pajaros'][editIndex];
            }
            return `
                <div class="admin-controls" style="border: 2px solid #36c; margin-top: 10px;">
                    <h3>${isEditing ? 'Editar Pájaro' : 'Añadir Pájaro en ' + targetRarity}</h3>
                    <div class="form-group"><label>Nombre:</label><input type="text" id="dyn-pj-title" value="${pData.title}"></div>
                    <div class="form-group"><label>Zona:</label>
                        <select id="dyn-pj-zone">
                            ${db.zones.map(z => `<option value="${z.name}" ${pData.zone === z.name ? 'selected' : ''}>${z.name}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label>Dinero ($/sec):</label><input type="text" id="dyn-pj-money" value="${pData.money || ''}"></div>
                    <div class="form-group"><label>Información:</label><textarea id="dyn-pj-text" rows="3">${pData.text}</textarea></div>
                    <div class="form-group"><label>Imagen:</label><input type="file" id="pj-media-file" accept="image/*" onchange="previewFileCustom('pajaros')"><div id="pj-preview-area"></div></div>
                    <div style="display:flex; gap:10px;">
                        <button class="primary" onclick="saveDynamicPajaro(${isEditing ? editIndex : -1})">Guardar Pájaro</button>
                        <button onclick="activeFormState = {type: null, rarity: null, editIndex: -1}; renderPajaros();">Cancelar</button>
                    </div>
                </div>
            `;
        }

        function saveDynamicPajaro(editIndex) {
            const title = document.getElementById('dyn-pj-title').value;
            const zone = document.getElementById('dyn-pj-zone').value;
            const money = document.getElementById('dyn-pj-money').value;
            const text = document.getElementById('dyn-pj-text').value;
            if (!title || !money || !text) return;
            
            let rarity = editIndex >= 0 ? db.posts['pajaros'][editIndex].rarity : activeFormState.rarity;
            let media = editIndex >= 0 ? db.posts['pajaros'][editIndex].media : null;
            let mediaType = editIndex >= 0 ? db.posts['pajaros'][editIndex].mediaType : null;

            if (activeMediaData['pajaros']) {
                media = activeMediaData['pajaros'].data;
                mediaType = activeMediaData['pajaros'].type;
            }

            const pajaroObj = { title, rarity, zone, money, text, media, mediaType };
            if (editIndex >= 0) {
                db.posts['pajaros'][editIndex] = pajaroObj;
            } else {
                if(!db.posts['pajaros']) db.posts['pajaros'] = [];
                db.posts['pajaros'].push(pajaroObj);
            }

            saveDB(db); activeFormState = { type: null, rarity: null, editIndex: -1 }; activeMediaData['pajaros'] = null;
            renderPajaros();
        }

        function parseMoneyValue(moneyStr) {
            if (!moneyStr) return 0;
            let clean = moneyStr.toString().replace(/[$,\s\/sec]/gi, '').trim();
            const suffixes = ["k", "m", "b", "t", "qa", "qi", "sx", "spt", "oct", "nv", "dc", "ud", "dd", "td", "qad", "qid", "sxd", "spd", "ocd", "nvd", "vc"];
            let multiplier = 1, lowerClean = clean.toLowerCase();
            for (let i = 0; i < suffixes.length; i++) {
                if (lowerClean.endsWith(suffixes[i])) {
                    multiplier = Math.pow(10, (i + 1) * 3);
                    clean = clean.substring(0, clean.length - suffixes[i].length);
                    break;
                }
            }
            let num = parseFloat(clean);
            return isNaN(num) ? 0 : num * multiplier;
        }

        function renderRarityCheckboxes() {
            const container = document.getElementById('rarity-checkboxes-container');
            if(!container) return;
            container.innerHTML = db.rarities.map(r => {
                if (activeRarityFilters[r.name] === undefined) activeRarityFilters[r.name] = true;
                return `
                    <label class="rarity-filter-item">
                        <input type="checkbox" ${activeRarityFilters[r.name] ? 'checked' : ''} onchange="activeRarityFilters['${r.name}'] = this.checked; renderPajaros();">
                        <span class="rarity-badge" style="background:${r.style}; font-size:0.75rem; padding:2px 6px;">${r.name}</span>
                    </label>
                `;
            }).join('');
        }

        function renderPajaros() {
            renderRarityCheckboxes();
            const container = document.getElementById('posts-pajaros');
            const searchVal = document.getElementById('search-pajaros')?.value.toLowerCase() || "";
            const posts = db.posts['pajaros'] || [];

            let htmlOutput = '';
            const isAdmin = db.currentUser ? db.currentUser.isAdmin : false;

            if (currentSortMode === 'rarity') {
                db.rarities.forEach((rObj) => {
                    if (activeRarityFilters[rObj.name] === false) return;
                    let rPosts = posts.filter(p => p.rarity === rObj.name);
                    if (searchVal) rPosts = rPosts.filter(p => p.title.toLowerCase().includes(searchVal));

                    rPosts.sort((a, b) => parseMoneyValue(a.money) - parseMoneyValue(b.money));

                    let addBtnHtml = isAdmin ? `<button class="primary" style="font-size:0.75rem; padding:2px 6px;" onclick="event.stopPropagation(); toggleAddForm('${rObj.name}')">+ Añadir</button>` : '';
                    let addFormHtml = (activeFormState.type === 'create' && activeFormState.rarity === rObj.name) ? renderDynamicPajaroForm(false, rObj.name, -1) : '';

                    let contentHtml = rPosts.length === 0 ? `<p style="color: #72777d; font-style: italic; margin: 0 0 10px 0;">No hay pájaros en esta rareza todavía.</p>` :
                        rPosts.map(p => {
                            let originalIdx = posts.indexOf(p);
                            let imgTag = p.media ? `<div class="media-container"><img src="${p.media}"></div>` : '';
                            let zoneObj = db.zones.find(z => z.name === p.zone) || { style: '#717171' };
                            let editFormHtml = (activeFormState.type === 'edit' && activeFormState.editIndex === originalIdx) ? renderDynamicPajaroForm(true, rObj.name, originalIdx) : '';
                            let adminButtons = isAdmin ? `<div style="margin-top: 15px; display: flex; gap: 10px;"><button onclick="toggleEditForm(${originalIdx})">Editar</button><button class="danger" onclick="deleteGenericPost('pajaros', ${originalIdx})">Eliminar</button></div>` : '';
                            
                            return `
                                <div class="post-card">
                                    <div class="post-left">
                                        <h3 style="margin-top:0;">${p.title}</h3>
                                        <p><strong>Rareza:</strong> <span class="rarity-badge" style="background:${rObj.style};">${p.rarity}</span> | <strong>Zona:</strong> <span class="zone-badge" style="background:${zoneObj.style};">${p.zone || 'Zona 1'}</span></p>
                                        <p><strong>Dinero:</strong> $${p.money}/sec</p>
                                        <p>${p.text}</p>
                                        ${adminButtons}
                                    </div>
                                    <div class="post-right">${imgTag}</div>
                                </div>
                                ${editFormHtml}
                            `;
                        }).join('');

                    htmlOutput += `
                        <div class="rarity-category-group">
                            <div class="rarity-category-header" style="background: ${rObj.style};">
                                <span>Rareza: ${rObj.name} (${rPosts.length})</span>${addBtnHtml}
                            </div>
                            <div class="rarity-category-body">${contentHtml}${addFormHtml}</div>
                        </div>
                    `;
                });
            } else if (currentSortMode === 'zone') {
                db.zones.forEach((zObj) => {
                    let zPosts = posts.filter(p => (p.zone || 'Zona 1') === zObj.name);
                    if (searchVal) zPosts = zPosts.filter(p => p.title.toLowerCase().includes(searchVal));
                    zPosts = zPosts.filter(p => activeRarityFilters[p.rarity] !== false);
                    zPosts.sort((a, b) => parseMoneyValue(a.money) - parseMoneyValue(b.money));

                    let contentHtml = zPosts.length === 0 ? `<p style="color: #72777d; font-style: italic; margin: 0 0 10px 0;">No hay pájaros en esta zona.</p>` :
                        zPosts.map(p => {
                            let originalIdx = posts.indexOf(p);
                            let imgTag = p.media ? `<div class="media-container"><img src="${p.media}"></div>` : '';
                            let rObj = db.rarities.find(r => r.name === p.rarity) || { style: '#717171' };
                            let editFormHtml = (activeFormState.type === 'edit' && activeFormState.editIndex === originalIdx) ? renderDynamicPajaroForm(true, null, originalIdx) : '';
                            let adminButtons = isAdmin ? `<div style="margin-top: 15px; display: flex; gap: 10px;"><button onclick="toggleEditForm(${originalIdx})">Editar</button><button class="danger" onclick="deleteGenericPost('pajaros', ${originalIdx})">Eliminar</button></div>` : '';

                            return `
                                <div class="post-card">
                                    <div class="post-left">
                                        <h3 style="margin-top:0;">${p.title}</h3>
                                        <p><strong>Rareza:</strong> <span class="rarity-badge" style="background:${rObj.style};">${p.rarity}</span> | <strong>Zona:</strong> <span class="zone-badge" style="background:${zObj.style};">${zObj.name}</span></p>
                                        <p><strong>Dinero:</strong> $${p.money}/sec</p>
                                        <p>${p.text}</p>
                                        ${adminButtons}
                                    </div>
                                    <div class="post-right">${imgTag}</div>
                                </div>
                                ${editFormHtml}
                            `;
                        }).join('');

                    htmlOutput += `
                        <div class="rarity-category-group">
                            <div class="rarity-category-header" style="background: ${zObj.style};">
                                <span>Zona: ${zObj.name} (${zPosts.length})</span>
                            </div>
                            <div class="rarity-category-body">${contentHtml}</div>
                        </div>
                    `;
                });
            } else {
                let sortedPosts = [...posts];
                if (searchVal) sortedPosts = sortedPosts.filter(p => p.title.toLowerCase().includes(searchVal));
                sortedPosts = sortedPosts.filter(p => activeRarityFilters[p.rarity] !== false);

                sortedPosts.sort((a, b) => {
                    let valA = parseMoneyValue(a.money);
                    let valB = parseMoneyValue(b.money);
                    return currentSortMode === 'money-asc' ? valA - valB : valB - valA;
                });

                let contentHtml = sortedPosts.length === 0 ? `<p style="color: #72777d; font-style: italic; margin: 0 0 10px 0;">No hay pájaros.</p>` :
                    sortedPosts.map(p => {
                        let originalIdx = posts.indexOf(p);
                        let imgTag = p.media ? `<div class="media-container"><img src="${p.media}"></div>` : '';
                        let rObj = db.rarities.find(r => r.name === p.rarity) || { style: '#717171' };
                        let zoneObj = db.zones.find(z => z.name === p.zone) || { style: '#717171' };
                        let editFormHtml = (activeFormState.type === 'edit' && activeFormState.editIndex === originalIdx) ? renderDynamicPajaroForm(true, null, originalIdx) : '';
                        let adminButtons = isAdmin ? `<div style="margin-top: 15px; display: flex; gap: 10px;"><button onclick="toggleEditForm(${originalIdx})">Editar</button><button class="danger" onclick="deleteGenericPost('pajaros', ${originalIdx})">Eliminar</button></div>` : '';

                        return `
                            <div class="post-card">
                                <div class="post-left">
                                    <h3 style="margin-top:0;">${p.title}</h3>
                                    <p><strong>Rareza:</strong> <span class="rarity-badge" style="background:${rObj.style};">${p.rarity}</span> | <strong>Zona:</strong> <span class="zone-badge" style="background:${zoneObj.style};">${p.zone || 'Zona 1'}</span></p>
                                    <p><strong>Dinero:</strong> $${p.money}/sec</p>
                                    <p>${p.text}</p>
                                    ${adminButtons}
                                </div>
                                <div class="post-right">${imgTag}</div>
                            </div>
                            ${editFormHtml}
                        `;
                    }).join('');

                htmlOutput += `
                    <div class="rarity-category-group">
                        <div class="rarity-category-header" style="background: #36c;">
                            <span>Listado Ordenado por Dinero (${sortedPosts.length})</span>
                        </div>
                        <div class="rarity-category-body">${contentHtml}</div>
                    </div>
                `;
            }

            container.innerHTML = htmlOutput;
        }

        function deleteGenericPost(sectionId, index) {
            if (confirm("¿Eliminar pájaro?")) { db.posts[sectionId].splice(index, 1); saveDB(db); renderPajaros(); }
        }

        window.onload = function() { initApp(); };
    </script>
</body>
</html>
